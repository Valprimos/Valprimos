<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Valprimos</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="escudo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Squada+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --verde-principal: #0A4325;
            --verde-oscuro: #04140a;
            --marron-principal: #3B2421;
            --dorado: #E8C15A;
            --blanco-roto: #F0F4F1;
            --fuente-titulos: 'Playfair Display', serif;
            --fuente-moderna: 'Montserrat', sans-serif;
            --fuente-deportiva: 'Squada One', cursive;
            --transicion-fluida: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            --sombra-texto: 2px 4px 10px rgba(0,0,0,0.8);
        }

        body {
            font-family: var(--fuente-moderna); margin: 0; padding: 0;
            background-color: var(--verde-oscuro); color: var(--blanco-roto);
            background-image: linear-gradient(180deg, var(--verde-oscuro) 0%, #082b17 100%);
            overflow-x: hidden; 
        }

        /* --- ENCABEZADO FIJO --- */
        .header-container { 
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; 
            background-color: var(--verde-principal); border-bottom: 2px solid rgba(232, 193, 90, 0.2); 
            transition: var(--transicion-fluida);
        }
        
        .header-content { display: flex; flex-direction: column; align-items: center; padding-top: 20px; padding-bottom: 30px; transition: var(--transicion-fluida); }
        .escudo { height: 280px; width: auto; margin-bottom: 30px; transition: var(--transicion-fluida); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); }
        h1 { 
            font-family: var(--fuente-titulos); color: var(--dorado); 
            font-size: 4rem; letter-spacing: 4px; margin: 0; text-transform: uppercase; 
            transition: var(--transicion-fluida);
            text-shadow: var(--sombra-texto);
        }
        .subtitulo { font-family: var(--fuente-titulos); font-style: italic; color: var(--dorado); font-size: 1.4rem; transition: var(--transicion-fluida); letter-spacing: 4px; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        
        /* --- NAVEGACIÓN --- */
        nav { 
            background-color: var(--marron-principal); padding: 15px 0; text-align: center; 
            border-top: 1px solid rgba(232, 193, 90, 0.4); border-bottom: 3px solid var(--dorado); 
            transition: var(--transicion-fluida); position: relative;
        }

        .menu-toggle { display: none; }
        .nav-links { display: flex; justify-content: center; align-items: center; width: 100%; flex-wrap: wrap; }

        .nav-links a { color: var(--dorado); text-decoration: none; font-weight: 600; margin: 0 15px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; transition: 0.3s;}
        .nav-links a:hover, .nav-links a.activo { color: #FFF; border-bottom: 2px solid #FFF; padding-bottom: 5px; }

        /* SCROLL ENCABEZADO */
        .header-container.scrolled .header-content { padding-top: 10px; padding-bottom: 5px; }
        .header-container.scrolled .escudo { height: 70px; margin-bottom: 0; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); }
        .header-container.scrolled h1 { font-size: 1.8rem; letter-spacing: 2px; }
        .header-container.scrolled .subtitulo { font-size: 0; opacity: 0; height: 0; margin: 0; overflow: hidden; }
        .header-container.scrolled nav { padding: 10px 0; }

        /* --- HERO --- */
        .hero-galeria {
            height: 25vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; margin-top: 550px; transition: var(--transicion-fluida);
        }
        .hero-galeria.scrolled { margin-top: 220px; }
        
        .titulo-seccion {
            font-family: var(--fuente-titulos);
            color: var(--dorado);
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: var(--sombra-texto);
        }

        /* --- CONTENIDO GALERÍA --- */
        main { max-width: 1200px; margin: 0 auto 60px; padding: 0 20px; }

        .seccion-anio { margin-bottom: 80px; scroll-margin-top: 160px; }
        
        .titulo-anio {
            font-family: var(--fuente-deportiva); color: var(--dorado); font-size: 3.5rem; 
            margin: 0 0 10px 0; border-bottom: 2px solid rgba(232, 193, 90, 0.3); padding-bottom: 10px;
            display: inline-block; text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .subtitulo-anio { color: #ccc; font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; }
        .highlight { color: var(--dorado); font-weight: 800; }

        /* CUADRÍCULA DE FOTOS */
        .grid-galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .foto-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid rgba(232, 193, 90, 0.1);
            cursor: zoom-in;
            aspect-ratio: 4/3; /* Por defecto horizontales */
            background-color: rgba(10, 67, 37, 0.3);
            transition: 0.4s;
        }

        /* NUEVA CLASE PARA FOTOS VERTICALES (1760x3120 / 9:16) */
        .foto-item.vertical {
            aspect-ratio: 9/16;
        }

        .foto-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .foto-item.foto-item-video { cursor: default; }
        .foto-item.foto-item-video video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .foto-item.foto-item-video::after { display: none; }

        .foto-item:hover { border-color: var(--dorado); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .foto-item:hover img { transform: scale(1.1); }

        .foto-item::after {
            content: '🔍'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2rem; opacity: 0; transition: 0.3s; pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .foto-item:hover::after { opacity: 1; }

        /* --- VISOR DE IMÁGENES (LIGHTBOX) --- */
        .lightbox-overlay {
            display: none; position: fixed; z-index: 5000; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(5px);
            flex-direction: column; justify-content: center; align-items: center; 
            opacity: 0; transition: opacity 0.3s;
        }
        .lightbox-overlay.activo { display: flex; opacity: 1; }
        
        .lightbox-img {
            max-width: 90%; max-height: 80vh; border: 3px solid var(--dorado);
            border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,1); object-fit: contain;
            transition: 0.2s;
        }

        .cerrar-lightbox {
            position: absolute; top: 20px; right: 30px; color: #FFF; font-size: 50px; 
            cursor: pointer; transition: 0.3s; font-family: Arial, sans-serif; line-height: 1;
            text-shadow: 0 0 10px rgba(0,0,0,0.8); z-index: 5002;
        }
        .cerrar-lightbox:hover { color: var(--dorado); transform: scale(1.1); }

        .btn-nav-lightbox {
            position: absolute; top: 50%; transform: translateY(-50%);
            color: #FFF; font-size: 60px; cursor: pointer; user-select: none;
            transition: 0.3s; padding: 20px; text-shadow: 0 0 15px rgba(0,0,0,1);
            background: transparent; border: none; z-index: 5001; font-family: Arial, sans-serif;
        }
        .btn-nav-lightbox:hover { color: var(--dorado); transform: translateY(-50%) scale(1.2); }
        .btn-prev { left: 30px; }
        .btn-next { right: 30px; }

        .lightbox-caption {
            color: #FFF; font-family: var(--fuente-moderna); font-size: 1.05rem;
            text-align: center; background: rgba(0,0,0,0.75); padding: 15px 25px;
            border-radius: 8px; border: 1px solid var(--dorado); z-index: 5003;
            max-width: 80%; display: none; line-height: 1.6; margin-top: 20px;
        }

        /* =========================================================
            OPTIMIZACIÓN MÓVIL
            ========================================================= */
        @media (max-width: 850px) { 
            .escudo { height: 150px; margin-bottom: 15px; }
            h1 { font-size: 2.2rem; letter-spacing: 2px; }
            .subtitulo { font-size: 0.9rem; letter-spacing: 2px; margin-top: 5px; }
            
            nav { padding: 12px 0; }
            .menu-toggle { display: block; color: var(--dorado); font-weight: 800; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
            .nav-links { 
                display: none; position: absolute; top: 100%; left: 0; width: 100%; 
                background-color: var(--marron-principal); flex-direction: column; 
                padding: 10px 0; border-bottom: 3px solid var(--dorado); 
                box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 1001;
            }
            .nav-links.activo { display: flex; }
            .nav-links a { margin: 15px 0; font-size: 1.1rem; border-bottom: none !important;}

            .header-container.scrolled .escudo { height: 50px; }
            .header-container.scrolled h1 { font-size: 1.3rem; }

            .hero-galeria { margin-top: 350px; }
            .hero-galeria.scrolled { margin-top: 150px; }
            .titulo-seccion { font-size: 2.5rem; }

            .titulo-anio { font-size: 2.8rem; }
            .seccion-anio { scroll-margin-top: 100px; }
            
            /* En móvil las verticales se adaptan al ancho disponible automáticamente */
            .grid-galeria { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            
            .lightbox-img { max-width: 95%; max-height: 70vh; }
            .cerrar-lightbox { top: 10px; right: 20px; font-size: 40px; }
            .btn-nav-lightbox { font-size: 40px; padding: 10px; }
            .btn-prev { left: 5px; }
            .btn-next { right: 5px; }
            .lightbox-caption { font-size: 0.9rem; max-width: 95%; padding: 10px 15px; margin-top: 15px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>

    <div class="header-container" id="main-header">
        <div class="header-content">
            <img src="escudo.png" alt="Escudo Valprimos" class="escudo">
            <h1>VALPRIMOS</h1>
            <div class="subtitulo">RAÍCES DE LEYENDA</div>
        </div>
        <nav>
            <div class="menu-toggle" onclick="toggleMenu()">☰ Menú</div>
            <div class="nav-links" id="nav-links">
                <a href="index.html">Inicio</a>
                <a href="tienda.html">Tienda</a>
                <a href="jugadores.html">Jugadores</a> 
                <a href="calendario.html">Calendario</a>
                <a href="historia.html">Historia</a>
                <a href="galeria.html" class="activo" style="border-bottom: 2px solid var(--dorado);">Galería</a>
                <a href="juegos.html">Juegos</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
    </div>

    <section class="hero-galeria" id="hero-section">
        <h2 class="titulo-seccion">NUESTRO LEGADO EN IMÁGENES</h2>
    </section>

    <main id="contenedor-galeria">
        <!-- Se carga dinámicamente desde Supabase -->
    </main>

    <footer style="text-align: center; padding: 60px 0; opacity: 0.6; font-size: 0.85rem; letter-spacing: 2px; font-family: var(--fuente-moderna);">
        <div style="color: var(--dorado); font-weight: 800; margin-bottom: 5px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">
            VALPRIMOS 2026
        </div>
        &copy; RAÍCES DE LEYENDA - MADERA DE CAMPEONES
    </footer>

    <div id="lightbox" class="lightbox-overlay" onclick="cerrarFoto()">
        <span class="cerrar-lightbox" onclick="cerrarFoto()">&times;</span>
        <button class="btn-nav-lightbox btn-prev" onclick="cambiarFoto(-1, event)">&#10094;</button>
        
        <img id="lightbox-imagen" class="lightbox-img" src="" alt="Foto Valprimos Ampliada" onclick="event.stopPropagation()">
        
        <div id="lightbox-caption" class="lightbox-caption" onclick="event.stopPropagation()"></div>
        
        <button class="btn-nav-lightbox btn-next" onclick="cambiarFoto(1, event)">&#10095;</button>
    </div>

    <script>
        const header = document.getElementById('main-header');
        const hero = document.getElementById('hero-section');
        let headerShrunkMobile = false;
        let startY = 0;

        let indiceActual = 0;
        let arrayFotos = [];

        window.addEventListener('scroll', () => {
            if (window.innerWidth > 850) {
                if (window.scrollY > 40) {
                    header.classList.add('scrolled'); hero.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled'); hero.classList.remove('scrolled');
                }
            } else {
                if (window.scrollY > 40) {
                    header.classList.add('scrolled'); hero.classList.add('scrolled');
                    headerShrunkMobile = true;
                }
            }
        });

        window.addEventListener('touchstart', ev => {
            if (window.innerWidth <= 850 && window.scrollY <= 10) { startY = ev.touches[0].clientY; }
        }, {passive: true});

        window.addEventListener('touchmove', ev => {
            if (window.innerWidth <= 850 && window.scrollY <= 10 && headerShrunkMobile) {
                let currentY = ev.touches[0].clientY;
                if (currentY - startY > 40) {
                    header.classList.remove('scrolled'); hero.classList.remove('scrolled');
                    headerShrunkMobile = false;
                }
            }
        }, {passive: true});

        function toggleMenu() { document.getElementById('nav-links').classList.toggle('activo'); }

        function esVideo(url) {
            return /\.(mp4|webm|mov|ogg)(\?.*)?$/i.test(url);
        }

        async function cargarGaleria() {
            const cont = document.getElementById('contenedor-galeria');
            const { data: secciones, error } = await supabaseClient.from('galeria_secciones').select('*').order('orden', { ascending: true });
            if (error || !secciones || secciones.length === 0) {
                cont.innerHTML = '<p style="text-align:center; opacity:0.6; padding:40px 0;">Aún no hay fotos añadidas.</p>';
                return;
            }

            const { data: fotos } = await supabaseClient.from('galeria_fotos').select('*').order('orden', { ascending: true });

            cont.innerHTML = secciones.map(s => {
                const fotosSeccion = (fotos || []).filter(f => f.seccion_id === s.id);
                return `
                    <section class="seccion-anio">
                        <h2 class="titulo-anio">${s.titulo}</h2>
                        ${s.subtitulo ? `<div class="subtitulo-anio">${s.subtitulo}</div>` : ''}
                        <div class="grid-galeria">
                            ${fotosSeccion.map(f => esVideo(f.imagen_url) ? `
                                <div class="foto-item foto-item-video">
                                    <video src="${f.imagen_url}" controls playsinline></video>
                                </div>
                            ` : `
                                <div class="foto-item" onclick="abrirFoto(this)">
                                    <img src="${f.imagen_url}" alt="${s.titulo}" ${f.caption ? `data-caption="${f.caption.replace(/"/g, '&quot;')}"` : ''}>
                                </div>
                            `).join('') || '<p style="opacity:0.5; font-size:0.9rem;">Sin fotos en esta sección todavía.</p>'}
                        </div>
                    </section>
                `;
            }).join('');
        }
        cargarGaleria();

        function abrirFoto(elemento) {
            const imgTarget0 = elemento.querySelector('img');
            if (!imgTarget0) return;
            const seccionActual = elemento.closest('.seccion-anio');
            arrayFotos = Array.from(seccionActual.querySelectorAll('.foto-item img'));

            const imgTarget = elemento.querySelector('img');
            indiceActual = arrayFotos.indexOf(imgTarget);
            
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-imagen');
            const lightboxCaption = document.getElementById('lightbox-caption');
            const btnPrev = document.querySelector('.btn-prev');
            const btnNext = document.querySelector('.btn-next');
            
            lightboxImg.src = imgTarget.src;
            
            const captionTexto = imgTarget.getAttribute('data-caption');
            if (captionTexto) {
                lightboxCaption.innerHTML = captionTexto;
                lightboxCaption.style.display = 'block';
            } else {
                lightboxCaption.style.display = 'none';
            }
            
            if (arrayFotos.length <= 1) {
                btnPrev.style.display = 'none';
                btnNext.style.display = 'none';
            } else {
                btnPrev.style.display = 'block';
                btnNext.style.display = 'block';
            }

            lightbox.classList.add('activo');
            document.body.style.overflow = 'hidden'; 
        }

        function cerrarFoto() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('activo');
            document.body.style.overflow = 'auto'; 
        }

        function cambiarFoto(direccion, evento) {
            if (evento) evento.stopPropagation(); 
            
            if (arrayFotos.length <= 1) return;

            indiceActual += direccion;
            
            if (indiceActual < 0) {
                indiceActual = arrayFotos.length - 1;
            } else if (indiceActual >= arrayFotos.length) {
                indiceActual = 0;
            }
            
            const lightboxImg = document.getElementById('lightbox-imagen');
            const lightboxCaption = document.getElementById('lightbox-caption');
            
            lightboxImg.style.opacity = '0.5';
            setTimeout(() => {
                const nuevaImg = arrayFotos[indiceActual];
                lightboxImg.src = nuevaImg.src;
                
                const captionTexto = nuevaImg.getAttribute('data-caption');
                if (captionTexto) {
                    lightboxCaption.innerHTML = captionTexto;
                    lightboxCaption.style.display = 'block';
                } else {
                    lightboxCaption.style.display = 'none';
                }

                lightboxImg.style.opacity = '1';
            }, 100);
        }

        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('activo') && arrayFotos.length > 1) {
                if (e.key === 'ArrowLeft') cambiarFoto(-1, null);
                if (e.key === 'ArrowRight') cambiarFoto(1, null);
            }
            if (lightbox.classList.contains('activo') && e.key === 'Escape') {
                cerrarFoto();
            }
        });
    </script>

</body>
</html>
