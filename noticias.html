<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias | Valprimos</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="escudo.png">
    <link rel="icon" type="image/png" sizes="192x192" href="escudo.png">
    <link rel="apple-touch-icon" href="escudo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Squada+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --verde-principal: #0A4325;
            --verde-oscuro: #04140a;
            --marron-principal: #3B2421;
            --dorado: #E8C15A;
            --blanco-roto: #F0F4F1;
            --fuente-titulos: 'Playfair Display', serif;
            --fuente-moderna: 'Montserrat', sans-serif;
            --fuente-deportiva: 'Squada One', cursive;
            --transicion-fluida: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            --sombra-texto: 2px 4px 10px rgba(0,0,0,0.8);
        }

        body {
            font-family: var(--fuente-moderna); margin: 0; padding: 0;
            background-color: var(--verde-oscuro); color: var(--blanco-roto);
            background-image: linear-gradient(180deg, var(--verde-oscuro) 0%, #082b17 100%);
            overflow-x: hidden;
        }

        /* --- ENCABEZADO FIJO --- */
        .header-container {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background-color: var(--verde-principal);
            border-bottom: 2px solid rgba(232, 193, 90, 0.2);
            transition: var(--transicion-fluida); 
        }

        .header-content {
            display: flex; flex-direction: column; align-items: center;
            padding-top: 20px; padding-bottom: 30px;
            transition: var(--transicion-fluida);
        }

        .escudo {
            height: 280px; width: auto;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
            margin-bottom: 30px; 
            transition: var(--transicion-fluida);
        }

        h1 {
            font-family: var(--fuente-titulos); color: var(--dorado);
            font-size: 4rem; letter-spacing: 4px; margin: 0; 
            text-transform: uppercase; text-shadow: var(--sombra-texto);
            transition: var(--transicion-fluida);
        }

        .subtitulo {
            font-family: var(--fuente-titulos); font-style: italic;
            color: var(--dorado); font-size: 1.4rem; letter-spacing: 4px;
            margin-top: 10px; text-transform: uppercase; transition: var(--transicion-fluida);
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        /* --- NAVEGACIÓN --- */
        nav {
            background-color: var(--marron-principal); padding: 15px 0; text-align: center;
            border-top: 1px solid rgba(232, 193, 90, 0.4); border-bottom: 3px solid var(--dorado);
            transition: var(--transicion-fluida); position: relative;
        }

        .menu-toggle { display: none; } /* Oculto en PC */
        .nav-links { display: flex; justify-content: center; align-items: center; width: 100%; }

        .nav-links a {
            color: var(--dorado); text-decoration: none; font-weight: 600; font-size: 0.9rem;
            margin: 0 20px; text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.activo { color: #FFF; border-bottom: 2px solid #FFF; padding-bottom: 5px; }

        /* --- ESTADOS SCROLLED --- */
        .header-container.scrolled .header-content { padding-top: 10px; padding-bottom: 5px; }
        .header-container.scrolled .escudo { height: 70px; margin-bottom: 0; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); }
        .header-container.scrolled h1 { font-size: 1.8rem; letter-spacing: 2px; }
        .header-container.scrolled .subtitulo { font-size: 0; opacity: 0; height: 0; margin: 0; overflow: hidden; }
        .header-container.scrolled nav { padding: 10px 0; }

        /* --- ESPACIADOR --- */
        .espaciador { height: 550px; transition: var(--transicion-fluida); }
        .espaciador.scrolled { height: 220px; }

        /* --- CONTENIDO PRINCIPAL --- */
        main { max-width: 1200px; margin: 0 auto 100px; padding: 60px 20px 0; text-align: center; }

        .titulo-seccion { 
            font-family: var(--fuente-titulos); color: var(--dorado); 
            font-size: 3.5rem; margin-bottom: 50px; text-transform: uppercase; 
            text-shadow: var(--sombra-texto); 
        }

        /* --- NOTICIAS --- */
        .grid-noticias {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px; text-align: left;
        }

        .noticia {
            background: rgba(10, 67, 37, 0.25); padding: 40px 30px; border-radius: 12px;
            border: 1px solid rgba(232, 193, 90, 0.1); border-left: 4px solid var(--dorado); 
            transition: 0.4s; display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer; position: relative; overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .noticia::after {
            content: 'Leer noticia completa →';
            position: absolute; bottom: 30px; right: 30px; color: var(--dorado);
            font-size: 0.9rem; font-weight: 800; text-transform: uppercase;
            opacity: 0; transform: translateX(-10px); transition: 0.3s;
        }

        .noticia:hover { 
            transform: translateY(-8px); background: rgba(10, 67, 37, 0.6); 
            border-color: rgba(232, 193, 90, 0.4); box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .noticia:hover::after { opacity: 1; transform: translateX(0); }

        .fecha-noticia { display: block; color: var(--dorado); font-size: 0.85rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 15px; }
        .noticia h3 { font-family: var(--fuente-titulos); color: #FFF; font-size: 1.8rem; margin: 0 0 15px 0; line-height: 1.2; text-transform: uppercase;}
        .noticia p { font-size: 1rem; margin: 0 0 25px 0; line-height: 1.6; color: #d1d9d4;}

        /* --- MODAL NOTICIAS --- */
        .modal-overlay { 
            display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); justify-content: center; align-items: center; 
        }
        .modal-overlay.activo { display: flex; }
        
        .modal-content { 
            background: linear-gradient(135deg, var(--verde-oscuro) 0%, var(--verde-principal) 100%); 
            width: 800px; max-width: 90%; max-height: 85vh; padding: 60px 50px; border: 2px solid var(--dorado); 
            border-radius: 15px; position: relative; box-shadow: 0 0 80px rgba(0,0,0,1); text-align: left;
            overflow-y: auto; box-sizing: border-box; 
            -webkit-overflow-scrolling: touch;
        }

        .modal-content .fecha-noticia { font-size: 1rem; margin-bottom: 20px; }
        .modal-content h2 { font-family: var(--fuente-titulos); color: #FFF; font-size: 2.8rem; margin: 0 0 30px 0; line-height: 1.1; text-transform: uppercase; }
        .modal-content p { color: #d1d9d4; font-size: 1.15rem; line-height: 1.8; margin-bottom: 20px; font-family: var(--fuente-moderna); }
        
        .cerrar-modal { position: absolute; top: 20px; right: 30px; color: #FFF; font-size: 40px; cursor: pointer; z-index: 100; transition: 0.3s;}
        .cerrar-modal:hover { color: var(--dorado); }

        /* Contenedor dinámico para imagen o vídeo en las noticias */
        .modal-media { margin-top: 25px; margin-bottom: 25px; text-align: center; }
        .modal-media img, .modal-media video { max-width: 100%; border-radius: 10px; border: 2px solid var(--dorado); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* Botón dentro de la noticia */
        .btn-noticia {
            display: inline-block; background-color: var(--dorado); color: var(--marron-principal);
            padding: 12px 30px; text-decoration: none; font-weight: 800; font-family: var(--fuente-deportiva);
            font-size: 1.4rem; text-transform: uppercase; border-radius: 4px; margin-top: 25px;
            transition: 0.3s; cursor: pointer; border: none;
        }
        .btn-noticia:hover { background-color: #FFF; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(232, 193, 90, 0.3); }

        /* =========================================================
            OPTIMIZACIÓN PORTÁTIL (1025px - 1440px)
            Evita que pantallas de portátil pequeño (13"-14") reciban
            el mismo tamaño de fuente/escudo que un monitor de escritorio.
            ========================================================= */
        @media (max-width: 1440px) {
            .escudo { height: 165px; margin-bottom: 16px; }
            h1 { font-size: 2.4rem; letter-spacing: 2.5px; }
            .subtitulo { font-size: 1rem; letter-spacing: 2.5px; }

            .header-container.scrolled .escudo { height: 54px; }
            .header-container.scrolled h1 { font-size: 1.45rem; }

            .espaciador { height: 340px; }
            .espaciador.scrolled { height: 165px; }

            main { padding-top: 35px; }
            .titulo-seccion { font-size: 2.3rem; }
            .modal-content h2 { font-size: 2rem; }
        }

        /* =========================================================
           OPTIMIZACIÓN MÓVIL Y TABLET (Max-width 1024px)
           ========================================================= */
        @media (max-width: 1024px) {
            .escudo { height: 150px; margin-bottom: 15px; }
            h1 { font-size: 2.2rem; letter-spacing: 2px; }
            .subtitulo { font-size: 0.9rem; letter-spacing: 2px; margin-top: 5px; }
            
            nav { padding: 12px 0; }
            .menu-toggle { display: block; color: var(--dorado); font-weight: 800; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
            .nav-links { 
                display: none; position: absolute; top: 100%; left: 0; width: 100%; 
                background-color: var(--marron-principal); flex-direction: column; 
                padding: 10px 0; border-bottom: 3px solid var(--dorado); 
                box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 1001;
            }
            .nav-links.activo { display: flex; }
            .nav-links a { margin: 15px 0; font-size: 1.1rem; border-bottom: none !important;}

            .header-container.scrolled .escudo { height: 50px; }
            .header-container.scrolled h1 { font-size: 1.3rem; }

            .espaciador { height: 350px; }
            .espaciador.scrolled { height: 150px; }

            main { padding: 30px 15px 0; }
            .titulo-seccion { font-size: 2.2rem; margin-bottom: 30px; }
            
            .grid-noticias { grid-template-columns: 1fr; gap: 20px; }
            .noticia { padding: 30px 20px; }
            .noticia h3 { font-size: 1.5rem; }

            .modal-content { 
                width: 100%; height: 100vh; max-height: 100vh; max-width: 100%; 
                border-radius: 0; border: none; padding: 75px 20px 30px; 
                box-sizing: border-box; 
            }
            .cerrar-modal { top: 25px; right: 20px; font-size: 50px; } 
            .modal-content h2 { font-size: 2rem; margin-bottom: 20px; }
            .modal-content p { font-size: 1rem; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>

    <div class="header-container" id="main-header">
        <div class="header-content">
            <img src="escudo.png" alt="Escudo Valprimos" class="escudo">
            <h1>VALPRIMOS</h1>
            <div class="subtitulo">RAÍCES DE LEYENDA</div>
        </div>

        <nav>
            <div class="menu-toggle" onclick="toggleMenu()">☰ Menú</div>
            <div class="nav-links" id="nav-links">
                <a href="index.html">Inicio</a>
                <a href="tienda.html">Tienda</a>
                <a href="jugadores.html">Jugadores</a>
                <a href="calendario.html">Calendario</a>
                <a href="historia.html">Historia</a>
                <a href="galeria.html">Galería</a>
                <a href="juegos.html">Juegos</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
    </div>

    <div class="espaciador" id="espaciador-fantasma"></div>

    <main>
        <h2 class="titulo-seccion">Actualidad del Club</h2>
        
        <div class="grid-noticias" id="contenedor-noticias">
            <!-- Las noticias se cargan dinámicamente desde Supabase -->
        </div>
    </main>

    <footer style="text-align: center; padding: 60px 0; opacity: 0.6; font-size: 0.85rem; letter-spacing: 2px; font-family: var(--fuente-moderna);">
        <div style="color: var(--dorado); font-weight: 800; margin-bottom: 5px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">
            VALPRIMOS 2026
        </div>
        &copy; RAÍCES DE LEYENDA - MADERA DE CAMPEONES
    </footer>

    <!-- MODAL DE NOTICIAS -->
    <div id="modal-noticia" class="modal-overlay" onclick="cerrarNoticia()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="cerrar-modal" onclick="cerrarNoticia()">&times;</span>
            <span class="fecha-noticia" id="m-news-date">CATEGORÍA</span>
            <h2 id="m-news-title">Título de la noticia</h2>
            <!-- Cambiado de <p> a <div> para poder meter el vídeo correctamente -->
            <div id="m-news-body">Contenido extendido de la noticia...</div>
        </div>
    </div>

    <script>
        const header = document.getElementById('main-header');
        const espaciador = document.getElementById('espaciador-fantasma');
        let headerShrunkMobile = false;
        let startY = 0;

        window.addEventListener('scroll', () => {
            if (window.innerWidth > 1024) {
                if (window.scrollY > 40) {
                    header.classList.add('scrolled');
                    espaciador.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                    espaciador.classList.remove('scrolled');
                }
            } else {
                if (window.scrollY > 40) {
                    header.classList.add('scrolled');
                    espaciador.classList.add('scrolled');
                    headerShrunkMobile = true;
                }
            }
        });

        window.addEventListener('touchstart', ev => {
            if (window.innerWidth <= 1024 && window.scrollY <= 10) {
                startY = ev.touches[0].clientY;
            }
        }, {passive: true});

        window.addEventListener('touchmove', ev => {
            if (window.innerWidth <= 1024 && window.scrollY <= 10 && headerShrunkMobile) {
                let currentY = ev.touches[0].clientY;
                if (currentY - startY > 40) {
                    header.classList.remove('scrolled');
                    espaciador.classList.remove('scrolled');
                    headerShrunkMobile = false;
                }
            }
        }, {passive: true});

        function toggleMenu() {
            document.getElementById('nav-links').classList.toggle('activo');
        }

        // Función abrirNoticia actualizada para soportar vídeo y botones
        function abrirNoticia(titulo, fecha, contenido, mediaHTML = null, urlBoton = null, textoBoton = null) {
            document.getElementById('m-news-title').innerText = titulo;
            document.getElementById('m-news-date').innerText = fecha;
            
            let htmlFinal = `<p>${contenido}</p>`;
            
            if (mediaHTML) {
                htmlFinal += `<div class="modal-media">${mediaHTML}</div>`;
            }

            if (urlBoton && textoBoton) {
                htmlFinal += `<a href="${urlBoton}" class="btn-noticia">${textoBoton}</a>`;
            }
            
            document.getElementById('m-news-body').innerHTML = htmlFinal;
            
            document.getElementById('modal-noticia').classList.add('activo');
            document.body.style.overflow = 'hidden'; 
        }

        const meses = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];

        function formatearFecha(fechaStr) {
            const f = new Date(fechaStr + 'T00:00:00');
            return `${String(f.getDate()).padStart(2, '0')} ${meses[f.getMonth()]} ${f.getFullYear()}`;
        }

        // Convierte los saltos de línea que escribes en el panel en párrafos reales (<p>)
        function formatearParrafos(texto) {
            return texto.split(/\n{2,}/).map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`).join('');
        }

        function textoPlano(texto) {
            return texto.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
        }

        async function cargarNoticias() {
            const contenedor = document.getElementById('contenedor-noticias');
            const { data, error } = await supabaseClient
                .from('noticias')
                .select('*')
                .order('fecha', { ascending: false });

            if (error) {
                console.error('Error cargando noticias:', error);
                contenedor.innerHTML = '<p style="opacity:0.7;">No se pudieron cargar las noticias.</p>';
                return;
            }

            if (!data || data.length === 0) {
                contenedor.innerHTML = '<p style="opacity:0.7;">Aún no hay noticias publicadas.</p>';
                return;
            }

            contenedor.innerHTML = data.map((n, i) => {
                const resumen = textoPlano(n.contenido);
                return `
                <article class="noticia" data-index="${i}">
                    <div>
                        <span class="fecha-noticia">${formatearFecha(n.fecha)}</span>
                        <h3>${n.titulo}</h3>
                        <p>${resumen.length > 140 ? resumen.slice(0, 140) + '…' : resumen}</p>
                    </div>
                </article>
            `;
            }).join('');

            contenedor.querySelectorAll('.noticia').forEach(el => {
                el.addEventListener('click', () => {
                    const n = data[parseInt(el.dataset.index)];
                    const media = n.video_url
                        ? `<video src="${n.video_url}" controls playsinline style="width:100%;border-radius:10px;margin-top:20px;"></video>`
                        : (n.imagen_url ? `<img src="${n.imagen_url}" style="width:100%;border-radius:10px;margin-top:20px;">` : null);
                    abrirNoticia(n.titulo, formatearFecha(n.fecha), formatearParrafos(n.contenido), media);
                });
            });
        }

        cargarNoticias();

        function cerrarNoticia() {
            document.getElementById('modal-noticia').classList.remove('activo');
            document.body.style.overflow = 'auto'; 
            
            // Pausar el vídeo si el usuario cierra el modal
            const mediaContainer = document.getElementById('m-news-body');
            const videoElement = mediaContainer.querySelector('video');
            if(videoElement) {
                videoElement.pause();
            }
        }
        
        // Cerrar modal con ESC
        window.addEventListener('keydown', (e) => { 
            if(e.key === 'Escape') cerrarNoticia(); 
        });
    </script>

</body>
</html>
