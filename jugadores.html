<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla | Valprimos</title>

    <link rel="icon" type="image/png" sizes="32x32" href="escudo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Squada+One&display=swap" rel="stylesheet">

    <style>
        :root {
            --verde-principal: #0A4325;
            --verde-oscuro: #04140a;
            --marron-principal: #3B2421;
            --dorado: #E8C15A;
            --blanco-roto: #F0F4F1;
            --fuente-titulos: 'Playfair Display', serif;
            --fuente-moderna: 'Montserrat', sans-serif;
            --fuente-deportiva: 'Squada One', cursive;
            --transicion-fluida: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            --sombra-texto: 2px 4px 10px rgba(0,0,0,0.8);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: var(--fuente-moderna); margin: 0; padding: 0;
            background-color: var(--verde-oscuro); color: var(--blanco-roto);
            background-image: linear-gradient(180deg, var(--verde-oscuro) 0%, #082b17 100%);
            overflow-x: hidden;
        }

        /* --- ENCABEZADO FIJO --- */
        .header-container {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background-color: var(--verde-principal); border-bottom: 2px solid rgba(232, 193, 90, 0.2);
            transition: var(--transicion-fluida);
        }

        .header-content { display: flex; flex-direction: column; align-items: center; padding-top: 20px; padding-bottom: 30px; transition: var(--transicion-fluida); }
        .escudo { height: 280px; width: auto; margin-bottom: 30px; transition: var(--transicion-fluida); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); }

        h1 {
            font-family: var(--fuente-titulos); color: var(--dorado);
            font-size: 4rem; letter-spacing: 4px; margin: 0; text-transform: uppercase;
            text-shadow: var(--sombra-texto); transition: var(--transicion-fluida);
        }

        .subtitulo { font-family: var(--fuente-titulos); font-style: italic; color: var(--dorado); font-size: 1.4rem; transition: var(--transicion-fluida); letter-spacing: 4px; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }

        /* --- NAVEGACIÓN --- */
        nav {
            background-color: var(--marron-principal); padding: 15px 0; text-align: center;
            border-top: 1px solid rgba(232, 193, 90, 0.4); border-bottom: 3px solid var(--dorado);
            transition: var(--transicion-fluida); position: relative;
        }

        .menu-toggle { display: none; }
        .nav-links { display: flex; justify-content: center; align-items: center; width: 100%; }
        .nav-links a { color: var(--dorado); text-decoration: none; font-weight: 600; margin: 0 20px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.activo { color: #FFF; border-bottom: 2px solid #FFF; padding-bottom: 5px; }

        /* ESTADOS SCROLLED */
        .header-container.scrolled .header-content { padding-top: 10px; padding-bottom: 5px; }
        .header-container.scrolled .escudo { height: 70px; margin-bottom: 0; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); }
        .header-container.scrolled h1 { font-size: 1.8rem; letter-spacing: 2px; }
        .header-container.scrolled .subtitulo { font-size: 0; opacity: 0; height: 0; overflow: hidden; margin: 0; }
        .header-container.scrolled nav { padding: 10px 0; }

        .espaciador { height: 550px; transition: var(--transicion-fluida); }
        .espaciador.scrolled { height: 220px; }

        /* --- TABS DE NAVEGACIÓN SECCIÓN --- */
        .section-tabs {
            display: flex; justify-content: center; gap: 0;
            max-width: 600px; margin: 0 auto 50px;
            background: rgba(10, 67, 37, 0.3);
            border: 2px solid rgba(232, 193, 90, 0.4);
            border-radius: 10px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .tab-btn {
            flex: 1; padding: 16px 20px; background: transparent; border: none;
            color: rgba(232, 193, 90, 0.6); font-family: var(--fuente-deportiva);
            font-size: 1.4rem; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s; position: relative;
        }
        .tab-btn.activo {
            background: var(--dorado); color: var(--marron-principal); font-weight: 800;
        }
        .tab-btn:not(:last-child) { border-right: 2px solid rgba(232, 193, 90, 0.4); }
        .tab-btn:hover:not(.activo) { background: rgba(232, 193, 90, 0.1); color: var(--dorado); }

        /* --- GRID JUGADORES --- */
        main { max-width: 1200px; margin: 0 auto 60px; padding: 0 20px; }
        .titulo-seccion { font-family: var(--fuente-titulos); color: var(--dorado); font-size: 3.5rem; text-align: center; margin-bottom: 40px; text-transform: uppercase; text-shadow: var(--sombra-texto); }

        .seccion-contenido { display: none; animation: fadeIn 0.5s ease-in-out; }
        .seccion-contenido.activa { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid-jugadores { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 35px; }

        .tarjeta-jugador {
            background: rgba(10, 67, 37, 0.4); border: 1px solid rgba(232, 193, 90, 0.2);
            border-radius: 8px; position: relative; overflow: hidden; cursor: pointer;
            transition: var(--transicion-fluida); height: 420px;
            transform-origin: top;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .tarjeta-jugador:hover { transform: scaleY(1.02); border-color: var(--dorado); box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 10; }

        .foto-jugador { width: 100%; height: 100%; object-fit: cover; object-position: center 55%; transition: 0.5s; filter: brightness(0.9); }
        .tarjeta-jugador:hover .foto-jugador { filter: brightness(1.1); transform: scale(1.01); }

        .nombre-bar {
            position: absolute; bottom: 0; width: 100%;
            background: linear-gradient(0deg, rgba(4, 20, 10, 0.95) 70%, transparent 100%);
            padding: 40px 15px 15px;
            display: flex; align-items: center; justify-content: space-between;
            box-sizing: border-box; z-index: 5;
        }

        .dorsal-destacado { font-family: var(--fuente-deportiva); color: var(--dorado); font-size: 3rem; width: 50px; text-align: left; line-height: 1; }
        .nombre-jugador { font-family: var(--fuente-deportiva); color: #FFF; font-size: 1.8rem; text-transform: uppercase; margin: 0; flex-grow: 1; text-align: center; letter-spacing: 1px; }
        .capitan-space { width: 50px; display: flex; justify-content: flex-end; }

        .c-capitan {
            font-family: var(--fuente-titulos); font-size: 1.2rem; color: #000; font-weight: 800;
            background-color: var(--dorado); display: inline-flex; justify-content: center; align-items: center;
            width: 32px; height: 32px; border-radius: 50% 50% 10% 10%; border: 2px solid #FFF;
            box-shadow: 0 0 10px rgba(232, 193, 90, 0.6), inset 0 0 5px rgba(0,0,0,0.4);
            line-height: 1; text-transform: uppercase; text-shadow: 1px 1px 1px rgba(255,255,255,0.5);
        }

        /* ============================================================
            ESTADÍSTICAS GENERALES DEL EQUIPO
            ============================================================ */
        .stats-equipo-header {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Reducido a 4 columnas porque quitamos asistencias */
            gap: 20px;
            margin-bottom: 50px;
        }
        .stat-equipo-card {
            background: rgba(10, 67, 37, 0.6);
            border: 1px solid rgba(232, 193, 90, 0.4);
            border-radius: 10px;
            padding: 25px 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .stat-equipo-card:hover { transform: translateY(-5px); border-color: var(--dorado); box-shadow: 0 12px 25px rgba(232, 193, 90, 0.2); }
        .stat-equipo-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--dorado);
        }
        .stat-equipo-card.ganados::before { background: #4caf50; }
        .stat-equipo-card.perdidos::before { background: #e53935; }
        .stat-equipo-num {
            font-family: var(--fuente-deportiva);
            font-size: 4.5rem;
            color: #FFF;
            line-height: 1;
            display: block;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .stat-equipo-label {
            font-family: var(--fuente-moderna); font-weight: 800; font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 2px; color: var(--dorado); margin-top: 10px; display: block;
        }

        /* --- TABLA ESTADÍSTICAS JUGADORES --- */
        .tabla-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 2px solid rgba(232, 193, 90, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            -webkit-overflow-scrolling: touch;
        }

        .tabla-stats {
            width: 100%; border-collapse: collapse; font-size: 1rem; min-width: 800px;
        }

        .tabla-stats thead tr {
            background: rgba(10, 67, 37, 0.9);
        }
        .tabla-stats thead th {
            padding: 20px 15px; text-align: center; font-family: var(--fuente-deportiva);
            color: var(--dorado); text-transform: uppercase; letter-spacing: 2px;
            font-size: 1.3rem; font-weight: 400; white-space: nowrap; cursor: pointer;
            border-bottom: 2px solid var(--dorado); user-select: none; transition: 0.3s;
        }
        .tabla-stats thead th:hover { background: rgba(232, 193, 90, 0.15); }
        .tabla-stats thead th span { font-size: 0.9rem; margin-left: 8px; opacity: 0.3; transition: 0.3s; }
        .tabla-stats thead th.active span { opacity: 1; color: #FFF; }
        .tabla-stats thead th:first-child { text-align: left; padding-left: 30px; }

        .tabla-stats tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.3s; cursor: pointer; background: rgba(0,0,0,0.2);
        }
        .tabla-stats tbody tr:hover { background: rgba(232, 193, 90, 0.15); }
        .tabla-stats tbody tr:last-child { border-bottom: none; }

        .tabla-stats tbody td { padding: 15px 15px; text-align: center; color: var(--blanco-roto); }
        .tabla-stats tbody td:first-child { text-align: left; padding-left: 30px; }

        .td-jugador { display: flex; align-items: center; gap: 15px; }
        .td-foto {
            width: 50px; height: 50px; border-radius: 50%;
            object-fit: cover; object-position: center 55%;
            border: 2px solid var(--dorado); flex-shrink: 0; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .td-nombre-wrap { display: flex; flex-direction: column; }
        .td-nombre { font-family: var(--fuente-deportiva); font-size: 1.4rem; color: #FFF; letter-spacing: 1px; text-transform: uppercase;}
        .td-dorsal { font-size: 0.8rem; color: var(--dorado); font-weight: 800; }

        .td-num { font-family: var(--fuente-deportiva); font-size: 1.6rem; color: #FFF; }
        .td-num.destacado { color: var(--dorado); }

        .tabla-stats tbody tr:nth-child(even) { background: rgba(10, 67, 37, 0.3); }
        .tabla-stats tbody tr:nth-child(even):hover { background: rgba(232, 193, 90, 0.15); }

        /* --- MODAL ESCRITORIO --- */
        .modal-jugador {
            display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); justify-content: center; align-items: center;
        }
        .modal-jugador.activo { display: flex; }
        .modal-content-horizontal {
            background: var(--verde-oscuro); width: 950px; max-width: 95%; height: 550px;
            border: 2px solid var(--dorado); border-radius: 15px; overflow: hidden;
            display: flex; position: relative; box-shadow: 0 0 60px rgba(0,0,0,1);
        }
        .modal-foto-sec { flex: 1; background: #000; position: relative; }
        .modal-foto-sec img { width: 100%; height: 100%; object-fit: cover; object-position: center 55%; }
        .modal-info-sec {
            flex: 1.3; padding: 50px; text-align: left;
            background: linear-gradient(135deg, var(--verde-oscuro) 0%, var(--verde-principal) 100%);
            display: flex; flex-direction: column; justify-content: center; overflow-y: auto;
        }

        .modal-header-info { display: flex; align-items: baseline; gap: 20px; border-bottom: 1px solid rgba(232, 193, 90, 0.3); padding-bottom: 15px; margin-bottom: 25px; }
        .modal-dorsal-grande { font-family: var(--fuente-deportiva); color: var(--dorado); font-size: 6rem; line-height: 1; }
        .modal-nombre { font-family: var(--fuente-deportiva); color: #FFF; font-size: 3.5rem; text-transform: uppercase; margin: 0; line-height: 1; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border-left: 3px solid var(--dorado); }
        .stat-num { display: block; font-size: 2.2rem; font-weight: 800; color: #FFF; line-height: 1; font-family: var(--fuente-deportiva); }
        .stat-desc { font-size: 0.75rem; text-transform: uppercase; color: var(--dorado); letter-spacing: 1.5px; margin-top: 5px; display: block; }
        .cup-badge { display: inline-flex; align-items: center; gap: 10px; background: rgba(232, 193, 90, 0.15); padding: 8px 20px; border-radius: 4px; border: 1px solid var(--dorado); color: var(--dorado); font-weight: 800; text-transform: uppercase; font-size: 0.8rem; margin-top: 20px; width: fit-content; }

        .cerrar-x { position: absolute; top: 25px; right: 30px; color: var(--dorado); font-size: 45px; cursor: pointer; z-index: 100; transition: 0.3s; }

        /* =========================================================
            OPTIMIZACIÓN MÓVIL
            ========================================================= */
        @media (max-width: 850px) {
            .escudo { height: 150px; margin-bottom: 15px; }
            h1 { font-size: 2.2rem; letter-spacing: 2px; }
            .subtitulo { font-size: 0.9rem; letter-spacing: 2px; margin-top: 5px; }

            nav { padding: 12px 0; }
            .menu-toggle { display: block; color: var(--dorado); font-weight: 800; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
            .nav-links { display: none; position: absolute; top: 100%; left: 0; width: 100%; background-color: var(--marron-principal); flex-direction: column; padding: 10px 0; border-bottom: 3px solid var(--dorado); box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 1001; }
            .nav-links.activo { display: flex; }
            .nav-links a { margin: 15px 0; font-size: 1.1rem; border-bottom: none !important; }

            .header-container.scrolled .escudo { height: 50px; }
            .header-container.scrolled h1 { font-size: 1.3rem; }

            .espaciador { height: 350px; }
            .espaciador.scrolled { height: 150px; }

            main { padding: 20px 12px 0; }
            .titulo-seccion { font-size: 2.5rem; margin-bottom: 25px; }

            /* Tabs */
            .section-tabs { margin-bottom: 30px; border-radius: 8px; }
            .tab-btn { padding: 12px 10px; font-size: 1.1rem; letter-spacing: 1px; }

            /* Grid plantilla */
            .grid-jugadores { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
            .tarjeta-jugador { height: 280px; }
            .nombre-bar { padding: 20px 10px 10px; }
            .dorsal-destacado { font-size: 2rem; width: 30px; }
            .nombre-jugador { font-size: 1.2rem; }
            .capitan-space { width: 30px; }
            .c-capitan { width: 24px; height: 24px; font-size: 0.9rem; }

            /* Stats equipo: 2 filas en móvil */
            .stats-equipo-header { grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }
            .stat-equipo-num { font-size: 3.2rem; }
            .stat-equipo-label { font-size: 0.75rem; letter-spacing: 1px; }
            .stat-equipo-card { padding: 20px 10px; }

            /* Tabla en móvil */
            .tabla-stats { min-width: 550px; }
            .tabla-stats thead th { padding: 15px 10px; font-size: 1rem; }
            .tabla-stats tbody td { padding: 12px 10px; }
            .td-foto { width: 45px; height: 45px; }
            .td-nombre { font-size: 1.1rem; }
            .td-num { font-size: 1.3rem; }

            /* Modal móvil */
            .modal-content-horizontal { flex-direction: column; height: 100vh; max-height: 100vh; width: 100%; max-width: 100%; border-radius: 0; border: none; overflow-y: auto; padding: 0; background: var(--verde-oscuro); }
            .modal-foto-sec { height: 60vh; flex: none; position: relative; }
            .modal-foto-sec::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 40%; background: linear-gradient(to bottom, transparent 0%, var(--verde-oscuro) 100%); pointer-events: none; }
            .modal-info-sec { padding: 0 20px 40px; flex: none; justify-content: flex-start; min-height: 40vh; background: var(--verde-oscuro); margin-top: -60px; position: relative; z-index: 2; }
            .modal-header-info { flex-wrap: nowrap; gap: 12px; align-items: flex-end; border-bottom: 1px solid rgba(232, 193, 90, 0.2); padding-bottom: 12px; margin-bottom: 20px; }
            .modal-dorsal-grande { font-size: 3.5rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
            .modal-nombre { font-size: 2.3rem; flex-grow: 1; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); word-break: break-word; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } /* 2 columnas en móvil para que quepan bien */
            .stat-card { padding: 12px; background: rgba(255,255,255,0.05); }
            .stat-num { font-size: 1.8rem; }
            .cerrar-x { top: 16px; right: 16px; font-size: 30px; color: #FFF; background: rgba(0,0,0,0.55); width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; border-radius: 50%; backdrop-filter: blur(5px); text-shadow: none; padding-bottom: 3px; }
        }
    </style>
</head>
<body>

    <div class="header-container" id="main-header">
        <div class="header-content">
            <img src="escudo.png" alt="Escudo Valprimos" class="escudo">
            <h1>VALPRIMOS</h1>
            <div class="subtitulo">RAÍCES DE LEYENDA</div>
        </div>
        <nav>
            <div class="menu-toggle" onclick="toggleMenu()">☰ Menú</div>
            <div class="nav-links" id="nav-links">
                <a href="index.html">Inicio</a>
                <a href="tienda.html">Tienda</a>
                <a href="jugadores.html" class="activo" style="border-bottom: 2px solid var(--dorado)">Jugadores</a>
                <a href="historia.html">Historia</a>
                <a href="galeria.html">Galería</a>
                <a href="fantasy.html">Fantasy</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
    </div>

    <div class="espaciador" id="espaciador-fantasma"></div>

    <main>
        <h2 class="titulo-seccion">PRIMER EQUIPO</h2>

        <!-- Tabs de sección -->
        <div class="section-tabs">
            <button class="tab-btn activo" onclick="cambiarTab('plantilla', this)">Plantilla</button>
            <button class="tab-btn" onclick="cambiarTab('estadisticas', this)">Estadísticas</button>
        </div>

        <!-- SECCIÓN PLANTILLA -->
        <div id="sec-plantilla" class="seccion-contenido activa">
            <div class="grid-jugadores" id="lista-plantilla"></div>
        </div>

        <!-- SECCIÓN ESTADÍSTICAS -->
        <div id="sec-estadisticas" class="seccion-contenido">

            <!-- Stats globales del equipo -->
            <div class="stats-equipo-header" id="stats-equipo-header">
                <!-- Se genera por JS -->
            </div>

            <!-- Tabla de jugadores -->
            <div class="tabla-wrapper">
                <table class="tabla-stats">
                    <thead>
                        <tr>
                            <th data-col="nombre" onclick="ordenarTabla('nombre')">Jugador <span>↕</span></th>
                            <th data-col="p" onclick="ordenarTabla('p')">PJ <span>↕</span></th>
                            <th data-col="g" onclick="ordenarTabla('g')">G <span>↕</span></th>
                            <th data-col="pe" onclick="ordenarTabla('pe')">P <span>↕</span></th>
                            <th data-col="go" onclick="ordenarTabla('go')" class="active">Goles <span>▼</span></th>
                            <th data-col="a" onclick="ordenarTabla('a')">Asist. <span>↕</span></th>
                        </tr>
                    </thead>
                    <tbody id="tbody-stats">
                        <!-- Se genera por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL -->
    <div id="modal-stats" class="modal-jugador" onclick="cerrarModal()">
        <div class="modal-content-horizontal" onclick="event.stopPropagation()">
            <span class="cerrar-x" onclick="cerrarModal()">&times;</span>
            <div class="modal-foto-sec"><img id="m-img" src="" alt=""></div>
            <div class="modal-info-sec">
                <div class="modal-header-info">
                    <span id="m-dorsal" class="modal-dorsal-grande">00</span>
                    <h2 id="m-nombre" class="modal-nombre">NOMBRE</h2>
                    <div id="m-capitan-container" style="margin-left: 10px;"></div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card"><span class="stat-num" id="s-partidos">0</span><span class="stat-desc">Partidos</span></div>
                    <div class="stat-card"><span class="stat-num" id="s-ganados">0</span><span class="stat-desc">Ganados</span></div>
                    <div class="stat-card"><span class="stat-num" id="s-perdidos">0</span><span class="stat-desc">Perdidos</span></div>
                    <div class="stat-card"><span class="stat-num" id="s-goles">0</span><span class="stat-desc">Goles</span></div>
                    <div class="stat-card"><span class="stat-num" id="s-asist">0</span><span class="stat-desc">Asistencias</span></div>
                </div>
                <div id="m-palmares">
                    <div class="cup-badge">🏆 Copa de las Colonias</div>
                </div>
            </div>
        </div>
    </div>

    <footer style="text-align: center; padding: 60px 0; opacity: 0.6; font-size: 0.85rem; letter-spacing: 2px; font-family: var(--fuente-moderna);">
        <div style="color: var(--dorado); font-weight: 800; margin-bottom: 5px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">
            VALPRIMOS 2026
        </div>
        &copy; RAÍCES DE LEYENDA - MADERA DE CAMPEONES
    </footer>

    <script>
        /* --- SCROLL HEADER --- */
        const header = document.getElementById('main-header');
        const espaciador = document.getElementById('espaciador-fantasma');
        let headerShrunkMobile = false;
        let startY = 0;

        window.addEventListener('scroll', () => {
            if (window.innerWidth > 850) {
                if (window.scrollY > 40) {
                    header.classList.add('scrolled');
                    espaciador.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                    espaciador.classList.remove('scrolled');
                }
            } else {
                if (window.scrollY > 40) {
                    header.classList.add('scrolled');
                    espaciador.classList.add('scrolled');
                    headerShrunkMobile = true;
                }
            }
        });

        window.addEventListener('touchstart', ev => {
            if (window.innerWidth <= 850 && window.scrollY <= 10) startY = ev.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', ev => {
            if (window.innerWidth <= 850 && window.scrollY <= 10 && headerShrunkMobile) {
                if (ev.touches[0].clientY - startY > 40) {
                    header.classList.remove('scrolled');
                    espaciador.classList.remove('scrolled');
                    headerShrunkMobile = false;
                }
            }
        }, { passive: true });

        function toggleMenu() {
            document.getElementById('nav-links').classList.toggle('activo');
        }

        /* --- TABS --- */
        function cambiarTab(seccion, btn) {
            document.querySelectorAll('.seccion-contenido').forEach(s => s.classList.remove('activa'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
            document.getElementById('sec-' + seccion).classList.add('activa');
            btn.classList.add('activo');
        }

        /* --- DATOS JUGADORES --- */
        const jugadores = [
            { nombre: "Álvaro",  dorsal: "00", foto: "alvaro.jpeg",  copa: true,  p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "Daniel",  dorsal: "10", foto: "daniel.jpeg",  capitan: true, copa: true, p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "Alberto", dorsal: "67", foto: "alberto.JPG",  copa: true,  p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "Nicolás", dorsal: "99", foto: "nicolas.JPG",  copa: false, p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "Jorge",   dorsal: "8",  foto: "jorge.jpg",    copa: true,  p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "Javier",  dorsal: "96", foto: "javier.JPG",   copa: true,  p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "Clara",   dorsal: "13", foto: "clara.JPG",    copa: false, p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "Carlos",  dorsal: "7",  foto: "carlos.JPG",   copa: false, p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "David",   dorsal: "15", foto: "david.JPG",    copa: false, p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "Pedro",   dorsal: "79", foto: "pedro.jpeg",   copa: true,  p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "Juan",    dorsal: "90", foto: "juan.jpeg",    copa: true,  p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "César",   dorsal: "88", foto: "cesar.JPG",    copa: false, p: 0, g: 0, pe: 0, go: 0, a: 0 },
            { nombre: "Pablo",   dorsal: "86", foto: "pablo.JPG",    copa: false, p: 0, g: 0, pe: 0, go: 0, a: 0 }
        ];

        /* --- STATS GLOBALES DEL EQUIPO (SIN ASISTENCIAS) --- */
        const totales = jugadores.reduce((acc, j) => {
            acc.p  = Math.max(acc.p,  j.p);   
            acc.g  = Math.max(acc.g,  j.g);
            acc.pe = Math.max(acc.pe, j.pe);
            acc.go += j.go;
            return acc;
        }, { p: 0, g: 0, pe: 0, go: 0 });

        const statsEquipo = [
            { label: "Partidos",   val: totales.p,  clase: "" },
            { label: "Ganados",    val: totales.g,  clase: "ganados" },
            { label: "Perdidos",   val: totales.pe, clase: "perdidos" },
            { label: "Goles",      val: totales.go, clase: "" }
        ];

        const headerStats = document.getElementById('stats-equipo-header');
        statsEquipo.forEach(s => {
            headerStats.innerHTML += `
                <div class="stat-equipo-card ${s.clase}">
                    <span class="stat-equipo-num">${s.val}</span>
                    <span class="stat-equipo-label">${s.label}</span>
                </div>`;
        });

        /* --- LÓGICA DE LA TABLA ORDENABLE CON TRIPLE CLIC --- */
        let columnaActual = 'go'; // Por defecto ordenado por Goles
        let ordenAscendente = false; 
        let clicsConsecutivos = 1;

        function renderizarTabla() {
            const tbody = document.getElementById('tbody-stats');
            tbody.innerHTML = '';

            const jugadoresOrdenados = [...jugadores].sort((a, b) => {
                let valorA = a[columnaActual];
                let valorB = b[columnaActual];
                
                // Si son textos (nombres) los pasamos a minúscula para ordenar bien
                if (typeof valorA === 'string') valorA = valorA.toLowerCase();
                if (typeof valorB === 'string') valorB = valorB.toLowerCase();

                if (valorA < valorB) return ordenAscendente ? -1 : 1;
                if (valorA > valorB) return ordenAscendente ? 1 : -1;
                return 0;
            });

            jugadoresOrdenados.forEach(j => {
                const tr = document.createElement('tr');
                tr.onclick = () => abrirModal(j);
                tr.innerHTML = `
                    <td>
                        <div class="td-jugador">
                            <img class="td-foto" src="${j.foto}" loading="lazy" alt="${j.nombre}">
                            <div class="td-nombre-wrap">
                                <span class="td-nombre">${j.nombre}${j.capitan ? ' <span style="color:var(--dorado);font-size:0.75rem">©</span>' : ''}</span>
                                <span class="td-dorsal">#${j.dorsal}</span>
                            </div>
                        </div>
                    </td>
                    <td><span class="td-num">${j.p}</span></td>
                    <td><span class="td-num" style="color:#4caf50">${j.g}</span></td>
                    <td><span class="td-num" style="color:#e53935">${j.pe}</span></td>
                    <td><span class="td-num destacado">${j.go}</span></td>
                    <td><span class="td-num destacado">${j.a}</span></td>
                `;
                tbody.appendChild(tr);
            });

            // Actualizar flechitas de los títulos
            document.querySelectorAll('.tabla-stats th').forEach(th => {
                const icono = th.querySelector('span');
                if (th.dataset.col === columnaActual) {
                    th.classList.add('active');
                    icono.innerText = ordenAscendente ? '▲' : '▼';
                } else {
                    th.classList.remove('active');
                    icono.innerText = '↕';
                }
            });
        }

        function ordenarTabla(columna) {
            if (columnaActual === columna) {
                clicsConsecutivos++;
                // Al tercer clic seguido, reiniciamos a la vista por defecto (Goles, descendente)
                if (clicsConsecutivos >= 3) {
                    columnaActual = 'go';
                    ordenAscendente = false;
                    clicsConsecutivos = 0; 
                } else {
                    ordenAscendente = !ordenAscendente;
                }
            } else {
                columnaActual = columna;
                clicsConsecutivos = 1; 
                if (columna === 'nombre') {
                    ordenAscendente = true;
                } else {
                    ordenAscendente = false; 
                }
            }
            renderizarTabla();
        }

        // Pintar la tabla por primera vez
        renderizarTabla();

        /* --- GRID PLANTILLA --- */
        const grid = document.getElementById('lista-plantilla');
        // El grid de tarjetas siempre se ordena por dorsal de menor a mayor
        const jugadoresGrid = [...jugadores].sort((a, b) => (a.dorsal === "00" ? -1 : b.dorsal === "00" ? 1 : parseInt(a.dorsal) - parseInt(b.dorsal)));
        
        jugadoresGrid.forEach(j => {
            const div = document.createElement('div');
            div.className = 'tarjeta-jugador';
            div.innerHTML = `
                <img src="${j.foto}" class="foto-jugador" loading="lazy" alt="${j.nombre}">
                <div class="nombre-bar">
                    <span class="dorsal-destacado">${j.dorsal}</span>
                    <h4 class="nombre-jugador">${j.nombre}</h4>
                    <div class="capitan-space">${j.capitan ? '<span class="c-capitan">C</span>' : ''}</div>
                </div>
            `;
            div.onclick = () => abrirModal(j);
            grid.appendChild(div);
        });

        /* --- MODAL FUNCIONES --- */
        function abrirModal(j) {
            document.getElementById('m-img').src = j.foto;
            document.getElementById('m-dorsal').innerText = j.dorsal;
            document.getElementById('m-nombre').innerText = j.nombre;
            document.getElementById('m-capitan-container').innerHTML = j.capitan ? '<span class="c-capitan">C</span>' : '';
            
            document.getElementById('s-partidos').innerText = j.p;
            document.getElementById('s-ganados').innerText = j.g;
            document.getElementById('s-perdidos').innerText = j.pe;
            document.getElementById('s-goles').innerText = j.go;
            document.getElementById('s-asist').innerText = j.a;
            
            document.getElementById('m-palmares').style.display = j.copa ? 'block' : 'none';
            document.getElementById('modal-stats').classList.add('activo');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal-stats').classList.remove('activo');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
    </script>
</body>
</html>
