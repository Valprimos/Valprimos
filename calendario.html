<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario | Valprimos</title>

    <link rel="icon" type="image/png" sizes="32x32" href="escudo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Squada+One&display=swap" rel="stylesheet">

    <style>
        :root {
            --verde-principal: #0A4325;
            --verde-oscuro: #04140a;
            --marron-principal: #3B2421;
            --dorado: #E8C15A;
            --blanco-roto: #F0F4F1;
            --fuente-titulos: 'Playfair Display', serif;
            --fuente-moderna: 'Montserrat', sans-serif;
            --fuente-deportiva: 'Squada One', cursive;
            --transicion-fluida: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            --sombra-texto: 2px 4px 10px rgba(0,0,0,0.8);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: var(--fuente-moderna); margin: 0; padding: 0;
            background-color: var(--verde-oscuro); color: var(--blanco-roto);
            background-image: linear-gradient(180deg, var(--verde-oscuro) 0%, #082b17 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- ENCABEZADO FIJO --- */
        .header-container {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background-color: var(--verde-principal); border-bottom: 2px solid rgba(232, 193, 90, 0.2);
            transition: var(--transicion-fluida);
        }

        .header-content { display: flex; flex-direction: column; align-items: center; padding-top: 20px; padding-bottom: 30px; transition: var(--transicion-fluida); }
        .escudo { height: 280px; width: auto; margin-bottom: 30px; transition: var(--transicion-fluida); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); }

        h1 {
            font-family: var(--fuente-titulos); color: var(--dorado);
            font-size: 4rem; letter-spacing: 4px; margin: 0; text-transform: uppercase;
            text-shadow: var(--sombra-texto); transition: var(--transicion-fluida);
        }

        .subtitulo { font-family: var(--fuente-titulos); font-style: italic; color: var(--dorado); font-size: 1.4rem; transition: var(--transicion-fluida); letter-spacing: 4px; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }

        /* --- NAVEGACIÓN --- */
        nav {
            background-color: var(--marron-principal); padding: 15px 0; text-align: center;
            border-top: 1px solid rgba(232, 193, 90, 0.4); border-bottom: 3px solid var(--dorado);
            transition: var(--transicion-fluida); position: relative;
        }

        .menu-toggle { display: none; }
        .nav-links { display: flex; justify-content: center; align-items: center; width: 100%; }
        .nav-links a { color: var(--dorado); text-decoration: none; font-weight: 600; margin: 0 20px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.activo { color: #FFF; border-bottom: 2px solid #FFF; padding-bottom: 5px; }

        /* ESTADOS SCROLLED */
        .header-container.scrolled .header-content { padding-top: 10px; padding-bottom: 5px; }
        .header-container.scrolled .escudo { height: 70px; margin-bottom: 0; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); }
        .header-container.scrolled h1 { font-size: 1.8rem; letter-spacing: 2px; }
        .header-container.scrolled .subtitulo { font-size: 0; opacity: 0; height: 0; overflow: hidden; margin: 0; }
        .header-container.scrolled nav { padding: 10px 0; }

        /* ESPACIADOR FIJO: Evita que la página pegue saltos raros al bajar */
        .espaciador { height: 480px; }

        /* --- TABS DE NAVEGACIÓN SECCIÓN --- */
        .section-tabs {
            display: flex; justify-content: center; gap: 0;
            max-width: 600px; margin: 0 auto 50px;
            background: rgba(10, 67, 37, 0.3);
            border: 2px solid rgba(232, 193, 90, 0.4);
            border-radius: 10px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .tab-btn {
            flex: 1; padding: 16px 20px; background: transparent; border: none;
            color: rgba(232, 193, 90, 0.6); font-family: var(--fuente-deportiva);
            font-size: 1.4rem; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s; position: relative;
        }
        .tab-btn.activo {
            background: var(--dorado); color: var(--marron-principal); font-weight: 800;
        }
        .tab-btn:not(:last-child) { border-right: 2px solid rgba(232, 193, 90, 0.4); }
        .tab-btn:hover:not(.activo) { background: rgba(232, 193, 90, 0.1); color: var(--dorado); }

        /* --- CALENDARIO CONTENIDO --- */
        main { max-width: 1000px; margin: 0 auto 60px; padding: 0 20px; }
        .titulo-seccion { font-family: var(--fuente-titulos); color: var(--dorado); font-size: 3.5rem; text-align: center; margin-bottom: 40px; text-transform: uppercase; text-shadow: var(--sombra-texto); }

        .seccion-contenido { display: none; animation: fadeIn 0.5s ease-in-out; }
        .seccion-contenido.activa { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- NUEVAS TARJETAS DE PARTIDO (Basadas en index.html) --- */
        .lista-partidos {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .match-card {
            background: linear-gradient(135deg, rgba(59, 36, 33, 0.9) 0%, rgba(10, 67, 37, 0.9) 100%);
            border: 2px solid var(--dorado); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 12px;
            padding: 35px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: 0.3s;
            margin-bottom: 25px; /* Margen para separarla de la lista generada por JS */
        }
        .match-card:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        
        .match-card .competicion { 
            font-size: 0.9rem; font-weight: 800; color: var(--dorado); 
            letter-spacing: 3px; margin-bottom: 25px; text-transform: uppercase; text-align: center;
        }
        .match-teams { 
            display: flex; align-items: center; justify-content: center; gap: 20px; 
            font-family: var(--fuente-titulos); font-size: 2.5rem; color: #FFF; width: 100%; text-align: center; 
            max-width: 800px;
        }
        .match-team { flex: 1; text-transform: uppercase; line-height: 1.1; word-break: break-word; }
        .match-team.valprimos { color: var(--dorado); text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        
        .match-vs { font-family: var(--fuente-deportiva); font-size: 2.5rem; color: var(--dorado); padding: 0 15px; }
        
        .match-info { 
            margin-top: 25px; font-size: 1.1rem; color: #ccc; letter-spacing: 1px; 
            text-align: center; line-height: 1.6;
        }
        .match-info strong { color: var(--dorado); }

        /* Colores específicos para Resultados */
        .competicion.victoria { color: #4caf50; }
        .competicion.derrota { color: #e53935; }
        .competicion.empate { color: #9e9e9e; }
        
        .marcador-pasado { font-size: 4rem; color: #FFF; letter-spacing: 5px; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .marcador-pasado.victoria { color: #4caf50; }
        .marcador-pasado.derrota { color: #e53935; }
        .marcador-pasado.empate { color: #9e9e9e; }

        /* Mensaje de vacío */
        .mensaje-vacio {
            text-align: center; color: rgba(232, 193, 90, 0.7); padding: 50px 20px;
            font-size: 1.3rem; font-weight: 600; background: rgba(10, 67, 37, 0.2);
            border-radius: 12px; border: 1px dashed rgba(232, 193, 90, 0.3);
        }

        /* =========================================================
            OPTIMIZACIÓN MÓVIL
            ========================================================= */
        @media (max-width: 850px) {
            .escudo { height: 150px; margin-bottom: 15px; }
            h1 { font-size: 2.2rem; letter-spacing: 2px; }
            .subtitulo { font-size: 0.9rem; letter-spacing: 2px; margin-top: 5px; }

            nav { padding: 12px 0; }
            .menu-toggle { display: block; color: var(--dorado); font-weight: 800; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
            .nav-links { display: none; position: absolute; top: 100%; left: 0; width: 100%; background-color: var(--marron-principal); flex-direction: column; padding: 10px 0; border-bottom: 3px solid var(--dorado); box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 1001; }
            .nav-links.activo { display: flex; }
            .nav-links a { margin: 15px 0; font-size: 1.1rem; border-bottom: none !important; }

            .header-container.scrolled .escudo { height: 50px; }
            .header-container.scrolled h1 { font-size: 1.3rem; }

            .espaciador { height: 260px; }

            main { padding: 20px 12px 0; }
            .titulo-seccion { font-size: 2.5rem; margin-bottom: 25px; }

            .section-tabs { margin-bottom: 30px; border-radius: 8px; }
            .tab-btn { padding: 12px 10px; font-size: 1.1rem; letter-spacing: 1px; }

            /* Tarjetas de partido en móvil con diseño apilado */
            .match-card { padding: 25px 15px; }
            .match-teams { flex-direction: column; gap: 10px; font-size: 1.8rem; }
            .match-vs { font-size: 1.8rem; padding: 0; }
            .marcador-pasado { font-size: 2.5rem; letter-spacing: 2px; }
            .match-info { font-size: 0.95rem; }
        }
        /* --- CAMPO DE ALINEACIÓN --- */
        .campo-pub {
            background: radial-gradient(ellipse at center, #1d6b3a 0%, #0f3d21 100%);
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 12px;
            padding: 30px 30px;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
            max-width: 780px;
            margin-left: auto; margin-right: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 26px;
            min-height: 280px;
            position: relative;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.35);
        }
        .campo-pub::before {
            content: ''; position: absolute; top: 50%; left: 6%; right: 6%; height: 1px; background: rgba(255,255,255,0.2);
        }
        .campo-pub::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; transform: translate(-50%,-50%);
        }
        .campo-linea-pub { display: flex; justify-content: center; gap: 44px; flex-wrap: wrap; position: relative; z-index: 1; }
        .campo-jugador-pub { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.2s; }
        .campo-jugador-pub:hover { transform: translateY(-3px); }
        .campo-foto-wrap { position: relative; }
        .campo-foto-wrap img {
            width: 86px; height: 86px; border-radius: 50%; object-fit: cover; display: block;
            border: 2px solid var(--dorado); box-shadow: 0 4px 14px rgba(0,0,0,0.55); background: #1a1a1a;
        }
        .campo-dorsal {
            position: absolute; bottom: -4px; right: -4px; background: var(--verde-oscuro); color: var(--dorado);
            font-weight: 800; font-size: 0.75rem; width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 2px solid var(--dorado);
        }
        .campo-jugador-pub span:not(.campo-dorsal) {
            background: var(--dorado); color: var(--verde-oscuro); font-weight: 800; font-size: 0.85rem;
            padding: 5px 15px; border-radius: 20px; box-shadow: 0 3px 8px rgba(0,0,0,0.4); white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.25);
        }

        /* --- TIMELINE ÚNICA DEL MARCADOR --- */
        .tl-cabecera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .tl-cabecera span { font-size: 0.65rem; letter-spacing: 1.5px; opacity: 0.5; font-weight: 700; flex: 1; }
        .timeline-marcador { position: relative; }
        .timeline-marcador::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
            background: rgba(232,193,90,0.2); transform: translateX(-50%);
        }
        .tl-fila { display: flex; align-items: center; position: relative; padding: 8px 0; z-index: 1; }
        .tl-lado { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .tl-izq { align-items: flex-end; text-align: right; padding-right: 16px; }
        .tl-der { align-items: flex-start; text-align: left; padding-left: 16px; }
        .tl-jugador { font-size: 0.88rem; font-weight: 700; }
        .tl-asist { font-size: 0.76rem; color: #999; }
        .tl-centro {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-width: 56px; gap: 1px;
        }
        .tl-marcador {
            background: var(--dorado); color: var(--verde-oscuro); font-weight: 800; font-size: 0.75rem;
            padding: 3px 9px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .tl-min { font-size: 0.65rem; opacity: 0.5; margin-top: 2px; }

        @media (max-width: 1024px) {
            .campo-pub { min-height: 240px; padding: 22px 16px; max-width: 100%; }
            .campo-linea-pub { gap: 24px; }
            .campo-foto-wrap img { width: 58px; height: 58px; }
            .campo-dorsal { width: 19px; height: 19px; font-size: 0.62rem; }
            .campo-dorsal { width: 16px; height: 16px; font-size: 0.58rem; }
            .campo-jugador-pub span:not(.campo-dorsal) { font-size: 0.68rem; padding: 3px 10px; }
            .tl-jugador { font-size: 0.78rem; }
            .tl-asist { font-size: 0.68rem; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>

    <div class="header-container" id="main-header">
        <div class="header-content">
            <img src="escudo.png" alt="Escudo Valprimos" class="escudo">
            <h1>VALPRIMOS</h1>
            <div class="subtitulo">RAÍCES DE LEYENDA</div>
        </div>
        <nav>
            <div class="menu-toggle" onclick="toggleMenu()">☰ Menú</div>
            <div class="nav-links" id="nav-links">
                <a href="index.html">Inicio</a>
                <a href="tienda.html">Tienda</a>
                <a href="jugadores.html">Jugadores</a>
                <a href="calendario.html" class="activo" style="border-bottom: 2px solid var(--dorado)">Calendario</a>
                <a href="historia.html">Historia</a>
                <a href="galeria.html">Galería</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </nav>
    </div>

    <div class="espaciador" id="espaciador-fantasma"></div>

    <main>
        <h2 class="titulo-seccion">CALENDARIO</h2>

        <div class="section-tabs">
            <button class="tab-btn activo" onclick="cambiarTab('futuros', this)">Próximos Partidos</button>
            <button class="tab-btn" onclick="cambiarTab('pasados', this)">Resultados</button>
        </div>

        <div id="sec-futuros" class="seccion-contenido activa">
            <div class="lista-partidos" id="contenedor-futuros">
                </div>
        </div>

        <div id="sec-pasados" class="seccion-contenido">
            <div class="lista-partidos" id="contenedor-pasados">
                </div>
        </div>

    </main>

    <footer style="text-align: center; padding: 60px 0; opacity: 0.6; font-size: 0.85rem; letter-spacing: 2px; font-family: var(--fuente-moderna);">
        <div style="color: var(--dorado); font-weight: 800; margin-bottom: 5px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">
            VALPRIMOS 2026
        </div>
        &copy; RAÍCES DE LEYENDA - MADERA DE CAMPEONES
    </footer>

    <script>
        /* --- SCROLL HEADER SÓLIDO (Sin alterar alturas para no saltar) --- */
        const header = document.getElementById('main-header');
        let headerShrunkMobile = false;
        let startY = 0;

        window.addEventListener('scroll', () => {
            if (window.innerWidth > 850) {
                if (window.scrollY > 40) {
                    header.classList.add('scrolled'); 
                } else {
                    header.classList.remove('scrolled'); 
                }
            } else {
                if (window.scrollY > 40) {
                    header.classList.add('scrolled'); 
                    headerShrunkMobile = true;
                }
            }
        });

        window.addEventListener('touchstart', ev => {
            if (window.innerWidth <= 850 && window.scrollY <= 10) startY = ev.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', ev => {
            if (window.innerWidth <= 850 && window.scrollY <= 10 && headerShrunkMobile) {
                if (ev.touches[0].clientY - startY > 40) {
                    header.classList.remove('scrolled'); 
                    headerShrunkMobile = false;
                }
            }
        }, { passive: true });

        function toggleMenu() { document.getElementById('nav-links').classList.toggle('activo'); }

        /* --- TABS --- */
        function cambiarTab(seccion, btn) {
            document.querySelectorAll('.seccion-contenido').forEach(s => s.classList.remove('activa'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
            document.getElementById('sec-' + seccion).classList.add('activa');
            btn.classList.add('activo');
        }

        /* --- DATOS DE LOS PARTIDOS --- 
           Añade aquí tus partidos cuando tengas las fechas. 
           
           EJEMPLO PARA PRÓXIMO PARTIDO:
           { dia: 24, mes: 4, año: 2026, hora: "19:00", rival: "Sporting C.", local: true, jugado: false, lugar: "Polideportivo T.L. Victoria" }
           
           EJEMPLO PARA PARTIDO JUGADO:
           { dia: 16, mes: 4, año: 2026, rival: "Real Vagos", local: true, jugado: true, golesV: 4, golesR: 1 }
        */
        const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
        const FOTOS = {
            "Álvaro":"alvaro.jpeg","Daniel":"daniel.jpeg","Alberto":"alberto.JPG","Nicolás":"nicolas.jpeg",
            "Jorge":"jorge.jpeg","Javier":"javier.JPG","Clara":"clara.JPG","Carlos":"carlos.jpeg","David":"david.jpeg",
            "Pedro":"pedro.jpeg","Juan":"juan.jpeg","César":"cesar.JPG","Pablo":"pablo.jpeg","Diego":"diego.jpeg"
        };
        const DORSALES = {
            "Álvaro":"00","Daniel":"10","Alberto":"67","Nicolás":"99","Jorge":"8","Javier":"96","Clara":"13",
            "Carlos":"7","David":"15","Pedro":"79","Juan":"90","César":"88","Pablo":"86","Diego":"9"
        };

        // Los partidos se cargan desde Supabase (tabla "partidos")
        let partidos = [];

        /* --- RENDERIZADO DEL CALENDARIO --- */
        const contFuturos = document.getElementById('contenedor-futuros');
        const contPasados = document.getElementById('contenedor-pasados');

        async function cargarPartidos() {
            const { data, error } = await supabaseClient
                .from('partidos')
                .select('*')
                .order('fecha', { ascending: true })
                .order('hora', { ascending: true });

            if (error) {
                console.error('Error cargando partidos:', error);
                contPasados.innerHTML = '<div class="mensaje-vacio">No se pudieron cargar los partidos.</div>';
                return;
            }

            // Adaptamos las filas de Supabase al formato que usa generarTarjetas()
            partidos = data.map(p => {
                const f = new Date(p.fecha + 'T00:00:00');
                return {
                    id: p.id,
                    dia: f.getDate(),
                    mes: f.getMonth() + 1,
                    año: f.getFullYear(),
                    hora: p.hora,
                    rival: p.rival,
                    local: true,
                    jugado: p.jugado,
                    lugar: p.lugar,
                    golesV: p.goles_valprimos,
                    golesR: p.goles_rival,
                    competicion: p.competicion
                };
            });

            generarTarjetas();
        }

        function generarTarjetas() {
            // Filtrar partidos
            const partidosFuturos = partidos.filter(p => !p.jugado);
            const partidosPasados = partidos.filter(p => p.jugado);

            // Mostrar mensaje si no hay datos.
            // Para el contenedor de futuros, al tener la tarjeta fija encima, puede que no necesites este mensaje, 
            // pero lo dejamos por si más adelante la quitas.
            if (partidosFuturos.length === 0) {
                contFuturos.innerHTML = '<div class="mensaje-vacio">Aún no hay próximos partidos programados.</div>';
            }
            if (partidosPasados.length === 0) {
                contPasados.innerHTML = '<div class="mensaje-vacio">Aún no hay resultados para mostrar.</div>';
            }

            // Generar tarjetas HTML para los datos del array `partidos`
            partidos.forEach(p => {
                const nombreMes = meses[p.mes - 1]; 
                
                // Formateo de los nombres de equipo según si jugamos en casa (local)
                let htmlEquipoIzq = p.local ? `<div class="match-team valprimos">VALPRIMOS</div>` : `<div class="match-team">${p.rival}</div>`;
                let htmlEquipoDer = p.local ? `<div class="match-team">${p.rival}</div>` : `<div class="match-team valprimos">VALPRIMOS</div>`;

                if (p.jugado) {
                    // --- TARJETA PARTIDO PASADO (RESULTADO) ---
                    let golesIzq = p.local ? p.golesV : p.golesR;
                    let golesDer = p.local ? p.golesR : p.golesV;
                    let marcador = `${golesIzq} - ${golesDer}`;
                    
                    let claseResultado = p.golesV > p.golesR ? 'victoria' : (p.golesV < p.golesR ? 'derrota' : 'empate');
                    let textoResultado = p.golesV > p.golesR ? 'VICTORIA' : (p.golesV < p.golesR ? 'DERROTA' : 'EMPATE');

                    contPasados.innerHTML += `
                        <div class="match-card">
                            <div class="competicion ${claseResultado}">${textoResultado}</div>
                            <div class="match-teams">
                                ${htmlEquipoIzq}
                                <div class="match-vs marcador-pasado ${claseResultado}">${marcador}</div>
                                ${htmlEquipoDer}
                            </div>
                            <div class="match-info">
                                ${p.competicion ? `🏆 ${p.competicion}<br>` : ''}📅 ${p.dia} ${nombreMes} ${p.año}
                            </div>
                            <div style="text-align:center; margin-top:12px;">
                                <button onclick="toggleDetalle('${p.id}', this)" style="background:transparent; border:1px solid var(--dorado); color:var(--dorado); padding:6px 16px; border-radius:5px; cursor:pointer; font-size:0.8rem; text-transform:uppercase; letter-spacing:1px;">Ver detalle</button>
                            </div>
                            <div id="detalle-${p.id}" style="display:none; margin-top:15px; text-align:left; border-top:1px solid rgba(232,193,90,0.15); padding-top:15px;"></div>
                        </div>
                    `;

                } else {
                    // --- TARJETA PRÓXIMO PARTIDO ---
                    contFuturos.innerHTML += `
                        <div class="match-card">
                            <div class="competicion">${p.competicion ? p.competicion.toUpperCase() : 'PRÓXIMO PARTIDO'}</div>
                            <div class="match-teams">
                                ${htmlEquipoIzq}
                                <div class="match-vs">VS</div>
                                ${htmlEquipoDer}
                            </div>
                            <div class="match-info">
                                📅 ${p.dia} ${nombreMes} ${p.año} | ⏱ ${p.hora}<br>
                                📍 <strong>${p.lugar}</strong>
                            </div>
                        </div>
                    `;
                }
            });
        }

        cargarPartidos();

        async function toggleDetalle(partidoId, boton) {
            const cont = document.getElementById('detalle-' + partidoId);
            if (cont.style.display === 'block') {
                cont.style.display = 'none';
                boton.textContent = 'Ver detalle';
                return;
            }
            boton.textContent = 'Cargando...';

            const [alin, gol, golRival, asis, tar, sus] = await Promise.all([
                supabaseClient.from('alineaciones').select('*').eq('partido_id', partidoId).order('titular', { ascending: false }),
                supabaseClient.from('goles').select('*').eq('partido_id', partidoId).order('minuto', { ascending: true }),
                supabaseClient.from('goles_rival').select('*').eq('partido_id', partidoId).order('minuto', { ascending: true }),
                supabaseClient.from('asistencias').select('*').eq('partido_id', partidoId).order('minuto', { ascending: true }),
                supabaseClient.from('tarjetas').select('*').eq('partido_id', partidoId).order('minuto', { ascending: true }),
                supabaseClient.from('sustituciones').select('*').eq('partido_id', partidoId).order('minuto', { ascending: true })
            ]);

            const titularesData = (alin.data || []).filter(a => a.titular);
            const suplentes = (alin.data || []).filter(a => !a.titular).map(a => a.jugador);
            const porLinea = { portero: [], defensa: [], centrocampista: [], delantero: [] };
            titularesData.forEach(t => { if (t.posicion && porLinea[t.posicion]) porLinea[t.posicion].push(t.jugador); });

            // Empareja cada gol con su asistencia (mismo minuto)
            const golesConAsist = (gol.data || []).map(g => {
                const asistencia = (asis.data || []).find(a => a.minuto === g.minuto);
                return { minuto: g.minuto, jugador: g.jugador, asistencia: asistencia ? asistencia.jugador : null };
            });

            // Cronología conjunta para calcular el marcador momento a momento
            const cronologia = [
                ...golesConAsist.map(g => ({ min: g.minuto ?? 999, propio: true, g })),
                ...(golRival.data || []).map(g => ({ min: g.minuto ?? 999, propio: false, g }))
            ].sort((a, b) => a.min - b.min);

            let marcadorV = 0, marcadorR = 0;
            const filasTimeline = [];
            cronologia.forEach(ev => {
                if (ev.propio) {
                    marcadorV++;
                    filasTimeline.push(`
                        <div class="tl-fila">
                            <div class="tl-lado tl-izq">
                                <span class="tl-jugador">⚽ ${ev.g.jugador}</span>
                                ${ev.g.asistencia ? `<span class="tl-asist">🅰️ ${ev.g.asistencia}</span>` : ''}
                            </div>
                            <div class="tl-centro"><span class="tl-marcador">${marcadorV}-${marcadorR}</span>${ev.min < 999 ? `<span class="tl-min">${ev.min}'</span>` : ''}</div>
                            <div class="tl-lado tl-der"></div>
                        </div>`);
                } else {
                    marcadorR++;
                    filasTimeline.push(`
                        <div class="tl-fila">
                            <div class="tl-lado tl-izq"></div>
                            <div class="tl-centro"><span class="tl-marcador">${marcadorV}-${marcadorR}</span>${ev.min < 999 ? `<span class="tl-min">${ev.min}'</span>` : ''}</div>
                            <div class="tl-lado tl-der"><span class="tl-jugador">⚫ Rival</span></div>
                        </div>`);
                }
            });

            const lineaHTML = (nombres) => `<div class="campo-linea-pub">${nombres.map(n => `
                <div class="campo-jugador-pub" onclick="window.location.href='jugadores.html?ver=${encodeURIComponent(n)}'">
                    <div class="campo-foto-wrap">
                        <img src="${FOTOS[n] || ''}" onerror="this.style.display='none'">
                        <span class="campo-dorsal">${DORSALES[n] || ''}</span>
                    </div>
                    <span>${n}</span>
                </div>`).join('')}</div>`;
            const hayAlineacion = titularesData.length > 0;

            let html = '';

            if (hayAlineacion) {
                html += `
                    <div style="margin-bottom:20px;">
                        <b style="color:var(--dorado); text-transform:uppercase; letter-spacing:1px; font-size:0.85rem;">Alineación · 1-2-1</b>
                        <div class="campo-pub">
                            ${lineaHTML(porLinea.delantero)}
                            ${lineaHTML(porLinea.centrocampista)}
                            ${lineaHTML(porLinea.defensa)}
                            ${lineaHTML(porLinea.portero)}
                        </div>
                        ${suplentes.length ? `<div style="margin-top:10px; opacity:0.65; font-size:0.85rem;">Suplentes: ${suplentes.join(', ')}</div>` : ''}
                    </div>`;
            }

            if (filasTimeline.length) {
                html += `
                    <div style="margin-bottom:20px;">
                        <div class="tl-cabecera">
                            <span>VALPRIMOS</span>
                            <b style="color:var(--dorado); text-transform:uppercase; letter-spacing:1px; font-size:0.8rem;">Marcador en directo</b>
                            <span style="text-align:right;">RIVAL</span>
                        </div>
                        <div class="timeline-marcador">
                            ${filasTimeline.join('')}
                        </div>
                    </div>`;
            }

            const otrosEventos = [];
            (tar.data || []).forEach(t => otrosEventos.push({ min: t.minuto ?? 999, html: `${t.tipo === 'roja' ? '🟥' : '🟨'} ${t.jugador}` }));
            (sus.data || []).forEach(s => otrosEventos.push({ min: s.minuto ?? 999, html: `🔁 ${s.jugador_sale} → ${s.jugador_entra}` }));
            otrosEventos.sort((a, b) => a.min - b.min);

            if (otrosEventos.length) {
                html += `<div>
                    <b style="color:var(--dorado); text-transform:uppercase; letter-spacing:1px; font-size:0.85rem;">Otros eventos</b>
                    <div style="margin-top:8px;">
                        ${otrosEventos.map(e => `<div style="padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:0.92rem;">${e.min < 999 ? `<span style="color:var(--dorado); font-weight:700;">${e.min}'</span> ` : ''}${e.html}</div>`).join('')}
                    </div>
                </div>`;
            }

            cont.innerHTML = html || '<span style="opacity:0.6;">Sin detalles añadidos para este partido.</span>';
            cont.style.display = 'block';
            boton.textContent = 'Ocultar detalle';
        }

    </script>
</body>
</html>
