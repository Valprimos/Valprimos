<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>La Pizarra | Valprimos</title>
    <link rel="icon" type="image/png" sizes="32x32" href="escudo.png">
    <link rel="apple-touch-icon" href="escudo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3B2421">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Squada+One&display=swap" rel="stylesheet">
    <style>
        :root{
            --dorado:#E8C15A; --verde:#0A4325; --oscuro:#04140a; --marron:#3B2421;
            --fuente-titulos:'Playfair Display',serif;
            --fuente-moderna:'Montserrat',sans-serif;
            --fuente-deportiva:'Squada One',cursive;
            --sombra-texto:2px 4px 10px rgba(0,0,0,0.8);
        }
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        html{height:100%;overflow:hidden;}
        body{
            position:fixed; inset:0; overflow:hidden;
            font-family:var(--fuente-moderna);
            background:var(--oscuro);
            color:#F0F4F1;
            display:flex;
            flex-direction:column;
            user-select:none;
            -webkit-user-select:none;
        }

        /* TOPBAR */
        .topbar{
            background:var(--verde);
            border-bottom:3px solid var(--dorado);
            padding:7px 16px;
            padding-top:calc(7px + env(safe-area-inset-top));
            display:flex;align-items:center;justify-content:space-between;
            flex-shrink:0; z-index:10;
        }
        .topbar-left{display:flex;align-items:center;gap:10px;}
        .topbar-logo{height:28px;filter:drop-shadow(0 2px 5px rgba(0,0,0,0.5));}
        .topbar-title{
            font-family:var(--fuente-titulos);color:var(--dorado);font-weight:800;
            font-size:1.3rem;letter-spacing:2px;text-transform:uppercase;
            text-shadow:var(--sombra-texto);
        }
        .topbar-back{
            color:var(--dorado);text-decoration:none;font-weight:800;font-size:0.7rem;
            text-transform:uppercase;letter-spacing:1px;
            border:1.5px solid rgba(232,193,90,0.4);border-radius:6px;padding:4px 10px;
            transition:0.25s;font-family:var(--fuente-moderna);
        }

        /* TOOLBAR */
        .toolbar{
            background:var(--marron);
            border-bottom:2px solid rgba(232,193,90,0.25);
            padding:6px 10px;display:flex;align-items:center;gap:6px;
            flex-shrink:0;overflow-x:auto;webkit-overflow-scrolling:touch;
            overscroll-behavior-x:contain;
        }
        .toolbar::-webkit-scrollbar, .side::-webkit-scrollbar, .fbar::-webkit-scrollbar { display:none; }
        .tg{display:flex;align-items:center;gap:4px;border-right:1px solid rgba(232,193,90,0.15);padding-right:8px;margin-right:2px;flex-shrink:0;}
        .tg:last-child{border-right:none;margin-left:auto;}
        .tb{
            background:rgba(0,0,0,0.3);border:1px solid rgba(232,193,90,0.2);border-radius:6px;
            color:rgba(232,193,90,0.8);font-family:var(--fuente-moderna);font-weight:800;
            font-size:0.65rem;text-transform:uppercase;letter-spacing:0.5px;
            padding:6px 10px;cursor:pointer;transition:0.2s;white-space:nowrap;flex-shrink:0;
            display:inline-flex;align-items:center;justify-content:center;
        }
        .tb.on{background:rgba(232,193,90,0.2);border-color:var(--dorado);color:var(--dorado);}
        .tb.pri{background:var(--dorado);color:var(--oscuro);border-color:var(--dorado);font-weight:800;}
        .tb.del{border-color:rgba(231,76,60,0.3);color:#e74c3c;}
        .clr{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);cursor:pointer;flex-shrink:0;}
        .clr.on{border-color:var(--dorado);transform:scale(1.2);box-shadow:0 0 6px rgba(232,193,90,0.4);}
        .tlabel{font-size:0.58rem;color:rgba(232,193,90,0.4);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}

        /* LAYOUT */
        .main-area{flex:1;display:flex;overflow:hidden;position:relative;background:#030d06;justify-content:center;align-items:center;}
        #campo-canvas{display:block;touch-action:none;}

        /* SIDE PANEL */
        .side{
            width:140px;background:rgba(4,14,8,0.98);
            border-left:2px solid rgba(232,193,90,0.2);
            overflow-y:auto;padding:8px 6px;flex-shrink:0;
            align-self:stretch;
        }
        .side-title{
            font-family:var(--fuente-titulos);color:rgba(232,193,90,0.7);
            font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;
            font-style:italic;margin:2px 0 6px;padding-bottom:4px;
            border-bottom:1px solid rgba(232,193,90,0.15);text-align:center;
        }
        .ji{
            display:flex;flex-direction:column;align-items:center;
            border-radius:6px;cursor:pointer;
            border:1px solid rgba(232,193,90,0.15);margin-bottom:6px;
            background:rgba(10,40,20,0.3);overflow:hidden;position:relative;
        }
        .ji.enc{opacity:0.25;pointer-events:none;}
        .jfoto{width:120px;height:150px;object-fit:cover;object-position:center 20%;display:block;}
        .ji-overlay{width:100%;background:linear-gradient(0deg,rgba(4,14,8,0.95) 0%,rgba(4,14,8,0.4) 60%,transparent 100%);padding:4px;position:absolute;bottom:0;}
        .jnombre{font-family:var(--fuente-deportiva);font-size:0.75rem;color:#FFF;text-transform:uppercase;text-align:center;letter-spacing:0.5px;line-height:1;}
        .jdorsal{font-family:var(--fuente-deportiva);font-size:0.65rem;color:var(--dorado);text-align:center;opacity:0.8;}

        /* FRAMES BAR */
        .fbar{
            background:var(--marron);border-top:2px solid rgba(232,193,90,0.2);
            padding:6px 10px;
            display:flex;align-items:center;gap:8px;
            flex-shrink:0;overflow-x:auto;webkit-overflow-scrolling:touch;
        }
        .flabel{font-family:var(--fuente-deportiva);color:rgba(232,193,90,0.5);font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;flex-shrink:0;}
        .fthumb{width:60px;height:38px;border-radius:4px;border:1.5px solid rgba(232,193,90,0.2);background:rgba(10,67,37,0.3);cursor:pointer;flex-shrink:0;overflow:hidden;position:relative;}
        .fthumb.on{border-color:var(--dorado);box-shadow:0 0 6px rgba(232,193,90,0.4);}
        .fthumb canvas{width:100%;height:100%;display:block;}
        .fnum{position:absolute;bottom:1px;right:3px;font-family:var(--fuente-deportiva);font-size:0.55rem;color:rgba(232,193,90,0.8);}
        .fadd{width:38px;height:38px;border-radius:6px;border:1.5px dashed rgba(232,193,90,0.3);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--dorado);font-size:1.2rem;flex-shrink:0;}
        .anim-ctrl{display:flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0;}
        .spd-sel{background:rgba(0,0,0,0.4);border:1px solid rgba(232,193,90,0.2);border-radius:4px;color:var(--dorado);font-size:0.65rem;padding:4px;font-family:var(--fuente-moderna);outline:none;}

        /* MODAL */
        .mdl{display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.85);backdrop-filter:blur(5px);align-items:center;justify-content:center;}
        .mdl.on{display:flex;}
        .mdl-box{background:var(--oscuro);border:2px solid var(--dorado);border-radius:12px;padding:20px;max-width:300px;width:88%;text-align:center;}
        .mdl-title{font-family:var(--fuente-titulos);color:var(--dorado);font-size:1.2rem;letter-spacing:1px;margin-bottom:12px;font-style:italic;}
        .mdl-btns{display:flex;flex-direction:column;gap:8px;}
        .mdl-btn{background:transparent;border:1.5px solid rgba(232,193,90,0.4);border-radius:6px;color:var(--dorado);font-family:var(--fuente-moderna);font-weight:800;font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;padding:10px;cursor:pointer;}
        .mdl-btn.cls{border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.4);}

        /* RESPONSIVE MÓVIL — campo vertical (porterías arriba/abajo) a todo
           lo ancho; los jugadores van en una franja horizontal debajo del
           campo (no a un lado), para no restarle anchura al campo. */
        @media (max-width: 820px){
            .topbar{padding-left:10px; padding-right:10px;}
            .topbar-title{font-size:1rem;}

            .toolbar{padding:5px 8px;gap:5px;}
            .tb{font-size:0.62rem;padding:5px 9px;}
            .tlabel{display:none;}
            .clr{width:20px;height:20px;}

            .main-area{flex-direction:column;}
            .side{
                width:100%; height:106px; flex-shrink:0;
                border-left:none; border-top:1.5px solid rgba(232,193,90,0.2);
                overflow-x:auto; overflow-y:hidden; padding:6px 8px; display:flex; flex-direction:column;
                box-sizing:border-box;
            }
            .side-title{display:none;}
            #jlist{display:flex; flex-direction:row; gap:8px; height:100%; align-items:center;}
            .ji{flex-shrink:0; width:68px; margin-bottom:0;}
            .jfoto{width:68px; height:90px;}
            .ji-overlay{padding:3px;}
            .jnombre{font-size:0.6rem;}
            .jdorsal{font-size:0.54rem;}

            .fbar{padding:5px 8px; gap:6px;}
            .flabel{font-size:0.6rem;}
            .fthumb{width:48px;height:32px;}
            .fadd{width:32px;height:32px;}
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <img src="escudo.png" class="topbar-logo" alt="">
        <span class="topbar-title">La Pizarra</span>
    </div>
    <a href="juegos.html" class="topbar-back">Volver</a>
</div>

<div class="toolbar">
    <div class="tg">
        <button class="tb on" id="t-sel" onclick="setTool('sel')">Selec.</button>
        <button class="tb" id="t-arr" onclick="setTool('arr')">Flecha</button>
        <button class="tb" id="t-lin" onclick="setTool('lin')">Línea</button>
        <button class="tb" id="t-cir" onclick="setTool('cir')">Círculo</button>
        <button class="tb" id="t-zon" onclick="setTool('zon')">Zona</button>
        <button class="tb" id="t-bal" onclick="setTool('bal')">Balón</button>
        <button class="tb" id="t-riv" onclick="setTool('riv')">+ Rival</button>
    </div>
    <div class="tg">
        <div class="clr on" style="background:#E8C15A" onclick="setColor('#E8C15A',this)"></div>
        <div class="clr" style="background:#FFF" onclick="setColor('#FFF',this)"></div>
        <div class="clr" style="background:#e74c3c" onclick="setColor('#e74c3c',this)"></div>
        <div class="clr" style="background:#3498db" onclick="setColor('#3498db',this)"></div>
        <div class="clr" style="background:#2ecc71" onclick="setColor('#2ecc71',this)"></div>
    </div>
    <div class="tg">
        <button class="tb on" id="f-221" onclick="setForm('2-2-1')">2-2-1</button>
        <button class="tb" id="f-122" onclick="setForm('1-2-2')">1-2-2</button>
        <button class="tb" id="f-131" onclick="setForm('1-3-1')">1-3-1</button>
        <button class="tb" id="f-212" onclick="setForm('2-1-2')">2-1-2</button>
    </div>
    <div class="tg">
        <button class="tb del" onclick="borrarTrazos()">Limpiar</button>
        <button class="tb del" onclick="borrarTodo()">Reset</button>
    </div>
    <div class="tg">
        <button class="tb pri" onclick="abrirDL()">Guardar</button>
    </div>
</div>

<div class="main-area">
    <canvas id="campo-canvas"></canvas>
    <div class="side" id="side-panel">
        <div class="side-title">Jugadores</div>
        <div id="jlist"></div>
    </div>
</div>

<div class="fbar">
    <span class="flabel">Frames</span>
    <div id="fcont" style="display:flex;gap:6px;"></div>
    <button class="fadd" onclick="addFrame()">+</button>
    <div class="anim-ctrl">
        <select class="spd-sel" id="spd">
            <option value="1800">Lento</option>
            <option value="1000" selected>Normal</option>
            <option value="500">Rápido</option>
        </select>
        <button class="tb" id="btn-play" onclick="toggleAnim()">Play</button>
        <button class="tb on" id="btn-interp" onclick="toggleInterp()">Suave</button>
    </div>
</div>

<div class="mdl" id="mdl-dl">
    <div class="mdl-box">
        <div class="mdl-title">Exportar Pizarra</div>
        <div class="mdl-btns">
            <button class="mdl-btn" onclick="dlFrame()">Fotograma actual (PNG)</button>
            <button class="mdl-btn" onclick="dlTodos()">Todos los fotogramas</button>
            <button class="mdl-btn cls" onclick="cerrarDL()">Cancelar</button>
        </div>
    </div>
</div>

<script>
const JUGS=[
    {id:0,n:"Alvaro",d:"00",f:"alvaro.jpeg"},
    {id:1,n:"Daniel",d:"10",f:"daniel.jpeg"},
    {id:2,n:"Alberto",d:"67",f:"alberto.JPG"},
    {id:3,n:"Nicolas",d:"99",f:"nicolas.jpeg"},
    {id:4,n:"Jorge",d:"8",f:"jorge.jpeg"},
    {id:5,n:"Javier",d:"96",f:"javier.JPG"},
    {id:6,n:"Clara",d:"13",f:"clara.JPG"},
    {id:7,n:"Carlos",d:"7",f:"carlos.jpeg"},
    {id:8,n:"David",d:"15",f:"david.jpeg"},
    {id:9,n:"Pedro",d:"79",f:"pedro.jpeg"},
    {id:10,n:"Juan",d:"90",f:"juan.jpeg"},
    {id:11,n:"Cesar",d:"88",f:"cesar.JPG"},
    {id:12,n:"Pablo",d:"86",f:"pablo.jpeg"},
    {id:13,n:"Diego",d:"9",f:"diego.jpeg"}
];

const IMG={};
JUGS.forEach(j=>{const i=new Image();i.src=j.f;IMG[j.id]=i;});
const IMG_BALON=new Image(); IMG_BALON.src='balon.png';

let tool='sel', color='#E8C15A', formActual='2-2-1';
let interpMode=true;
let frames=[], fi=0;
let animTimer=null, animRAF=null, animOn=false, animIdx=0;
let drawing=false, drawStart=null, drawCur=null;
let dragJug=null, dragBal=false, selJug=null;
let vertical=false, dpr=1, viewW=0, viewH=0;
let rivalSeq=0;

const canvas=document.getElementById('campo-canvas');
const ctx=canvas.getContext('2d');

const FORMS={
    '2-2-1':[[0.1,0.5],[0.28,0.28],[0.28,0.72],[0.55,0.28],[0.55,0.72],[0.78,0.5]],
    '1-2-2':[[0.1,0.5],[0.35,0.3],[0.35,0.7],[0.62,0.22],[0.62,0.5],[0.62,0.78]],
    '1-3-1':[[0.1,0.5],[0.38,0.18],[0.38,0.5],[0.38,0.82],[0.72,0.5],null],
    '2-1-2':[[0.1,0.32],[0.1,0.68],[0.42,0.5],[0.68,0.3],[0.68,0.7],null]
};
/* Versión para campo vertical (porterías arriba/abajo): mismo esquema
   táctico que FORMS pero con los ejes x/y intercambiados. */
const FORMS_V={};
Object.keys(FORMS).forEach(k=>{ FORMS_V[k]=FORMS[k].map(p=>p?[p[1],p[0]]:null); });

function mkFrame(){return{jugs:[],trazos:[],balon:null};}
function cf(){return frames[fi];}

function initFrames(){
    frames=[mkFrame()];fi=0;
    renderFBar();
}

function resize(){
    const area=document.querySelector('.main-area');
    vertical=window.innerWidth<=820;
    dpr=window.devicePixelRatio||1;

    let cw,ch;
    if(vertical){
        // Móvil: campo vertical a todo el ancho disponible; el panel de
        // jugadores va debajo (franja horizontal), no le resta ancho.
        const W=area.clientWidth, H=area.clientHeight-106;
        const ratio=0.72; // ancho/alto del campo en vertical (más ancho)
        ch=H; cw=ch*ratio;
        if(cw>W){ cw=W; ch=cw/ratio; }
    } else {
        const W=area.clientWidth-140, H=area.clientHeight;
        cw=W; ch=W*(9/16);
        if(ch>H){ ch=H; cw=H*(16/9); }
    }

    // El lienzo se dibuja a resolución de dispositivo (devicePixelRatio)
    // para que las fotos de los jugadores no se vean borrosas en móviles
    // de pantalla de alta densidad; el tamaño en CSS se mantiene aparte
    // en viewW/viewH para que los cálculos de posición sigan en 0-1.
    viewW=Math.floor(cw); viewH=Math.floor(ch);
    canvas.style.width=viewW+'px'; canvas.style.height=viewH+'px';
    canvas.width=Math.round(viewW*dpr); canvas.height=Math.round(viewH*dpr);
    render();
}
window.addEventListener('resize',resize);
window.addEventListener('load',resize);
if(window.visualViewport) window.visualViewport.addEventListener('resize',resize);
// Recalcula el tamaño del campo cada vez que el contenedor cambia de
// tamaño de verdad (en vez de fiarlo todo a una sola medición al cargar,
// que en algunos móviles llegaba antes de que la barra de estado / el
// resto del layout hubieran terminado de asentarse y dejaba el campo
// más alto de la cuenta, cortado por arriba y por abajo).
if(window.ResizeObserver){
    new ResizeObserver(()=>resize()).observe(document.querySelector('.main-area'));
}

function render(overrideFrame){
    const f=overrideFrame||cf();
    const W=viewW,H=viewH;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    drawCampo(W,H,vertical);
    if(f.balon) drawBalon(f.balon.x*W,f.balon.y*H);
    f.trazos.forEach(t=>drawTrazo(t,W,H));
    if(drawing&&drawStart&&drawCur&&tool!=='sel'&&tool!=='bal'){
        const preview=buildTrazo(drawStart,drawCur);
        if(preview) drawTrazo(preview,W,H,0.65);
    }
    f.jugs.forEach((j,i)=>drawJug(j,i,W,H));
}

function drawCampo(W,H,vert){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1e6b38');g.addColorStop(1,'#1a5a30');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=0;i<10;i++){if(i%2===0){ctx.fillStyle='rgba(0,0,0,0.04)';ctx.fillRect(i*W/10,0,W/10,H);}}

    ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=2;
    const m=W*0.02,mt=H*0.04;
    roundRect(ctx,m,mt,W-2*m,H-2*mt,4);ctx.stroke();

    if(vert){
        // Campo vertical: porterías arriba y abajo, línea de medio campo horizontal.
        ctx.beginPath();ctx.moveTo(m,H/2);ctx.lineTo(W-m,H/2);ctx.stroke();
        ctx.beginPath();ctx.arc(W/2,H/2,W*0.18,0,Math.PI*2);ctx.stroke();

        const aW=W*0.55,aOff=(W-aW)/2,aH=H*0.14;
        ctx.strokeRect(aOff,mt,aW,aH);
        ctx.strokeRect(aOff,H-mt-aH,aW,aH);
    } else {
        ctx.beginPath();ctx.moveTo(W/2,mt);ctx.lineTo(W/2,H-mt);ctx.stroke();
        ctx.beginPath();ctx.arc(W/2,H/2,H*0.18,0,Math.PI*2);ctx.stroke();

        const aH=H*0.55,aOff=(H-aH)/2,aW=W*0.14;
        ctx.strokeRect(m,aOff,aW,aH);
        ctx.strokeRect(W-m-aW,aOff,aW,aH);
    }
}

function roundRect(c,x,y,w,h,r){
    c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
    c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
    c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);
    c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();
}

/* Dibuja la imagen recortándola para llenar el rectángulo destino sin
   deformarla (equivalente a object-fit:cover), en vez de estirarla como
   hace drawImage por defecto cuando el rectángulo no tiene la misma
   proporción que la foto original. focusY sesga el recorte vertical
   hacia arriba (las caras), como object-position:center 20% en el resto
   del sitio. */
function drawImageCover(c,img,dx,dy,dw,dh,focusY=0.2){
    const iw=img.naturalWidth, ih=img.naturalHeight;
    if(!iw||!ih){ c.drawImage(img,dx,dy,dw,dh); return; }
    const boxRatio=dw/dh, imgRatio=iw/ih;
    let sx,sy,sw,sh;
    if(imgRatio>boxRatio){
        sh=ih; sw=ih*boxRatio; sx=(iw-sw)/2; sy=0;
    } else {
        sw=iw; sh=iw/boxRatio; sx=0; sy=(ih-sh)*focusY;
    }
    c.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);
}

function drawJug(j,idx,W,H){
    const x=j.x*W, y=j.y*H;

    if(j.rival){
        const r=Math.min(W,H)*0.08;
        ctx.save();
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fillStyle='#c0392b'; ctx.fill();
        ctx.lineWidth=2.5; ctx.strokeStyle=selJug===idx?'#FFF':'rgba(255,255,255,0.85)'; ctx.stroke();
        const ns=Math.round(r*0.85);
        ctx.font=`${ns}px "Squada One",cursive`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#FFF';
        ctx.fillText(j.n, x, y+ns*0.06);
        ctx.restore();
        return;
    }

    const rw=Math.min(W,H)*0.185;
    const rh=rw*1.4;
    const bx=x-rw/2, by=y-rh/2;

    ctx.save();
    ctx.beginPath(); roundRect(ctx,bx,by,rw,rh,5); ctx.save(); ctx.clip();

    const img=IMG[j.id];
    if(img&&img.complete&&img.naturalWidth){
        drawImageCover(ctx, img, bx, by, rw, rh);
    } else {
        ctx.fillStyle='#1a5c30'; ctx.fillRect(bx,by,rw,rh);
    }

    const gh=rh*0.35;
    const grad=ctx.createLinearGradient(0,by+rh-gh,0,by+rh);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(1,'rgba(0,0,0,0.9)');
    ctx.fillStyle=grad; ctx.fillRect(bx,by+rh-gh,rw,gh);
    ctx.restore();

    ctx.beginPath(); roundRect(ctx,bx,by,rw,rh,5);
    ctx.strokeStyle=selJug===idx?'#FFF':'rgba(232,193,90,0.85)';
    ctx.lineWidth=2; ctx.stroke();

    const ns=Math.round(rw*0.22);
    ctx.font=`${ns}px "Squada One",cursive`;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillStyle='#FFF';
    ctx.fillText(j.n.toUpperCase(), x, by+rh-2);
    ctx.restore();
}

function drawBalon(x,y){
    const r=Math.min(viewW,viewH)*0.065;
    if(IMG_BALON.complete&&IMG_BALON.naturalWidth){
        ctx.drawImage(IMG_BALON,x-r,y-r,r*2,r*2);
    } else {
        ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fillStyle='#FFF';ctx.fill();
    }
}

function drawTrazo(t,W,H,alpha){
    if(!t)return;
    ctx.save();ctx.globalAlpha=alpha||1;
    ctx.strokeStyle=t.color;ctx.fillStyle=t.color+'44';
    ctx.lineWidth=2.5;ctx.lineCap='round';

    if(t.tipo==='arr'||t.tipo==='lin'){
        const x1=t.x1*W,y1=t.y1*H,x2=t.x2*W,y2=t.y2*H;
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        if(t.tipo==='arr'){
            const ang=Math.atan2(y2-y1,x2-x1);
            const hs=Math.max(10,Math.min(W,H)*0.035);
            ctx.beginPath();
            ctx.moveTo(x2,y2);
            ctx.lineTo(x2-hs*Math.cos(ang-Math.PI/7),y2-hs*Math.sin(ang-Math.PI/7));
            ctx.lineTo(x2-hs*Math.cos(ang+Math.PI/7),y2-hs*Math.sin(ang+Math.PI/7));
            ctx.closePath();
            ctx.fillStyle=t.color;ctx.fill();
        }
    } else if(t.tipo==='cir'){
        ctx.beginPath();ctx.ellipse(t.cx*W,t.cy*H,t.rx*W,t.ry*H,0,0,Math.PI*2);ctx.stroke();
    } else if(t.tipo==='zon'){
        ctx.strokeRect(Math.min(t.x1,t.x2)*W,Math.min(t.y1,t.y2)*H,Math.abs(t.x2-t.x1)*W,Math.abs(t.y2-t.y1)*H);
    }
    ctx.restore();
}

function toggleAnim(){ animOn ? stopAnim() : playAnim(); }
function toggleInterp(){ interpMode=!interpMode; document.getElementById('btn-interp').classList.toggle('on',interpMode); }

function lerp(a,b,t){ return a+(b-a)*t; }

/* Fotograma "virtual" a medio camino entre fA y fB (0<=t<=1), usado para
   que la animación muestre el movimiento real de jugadores y balón en
   vez de saltar de golpe de una posición a la siguiente. */
function frameInterpolado(fA,fB,t){
    const jugs=fA.jugs.map(jA=>{
        const jB=fB.jugs.find(j=>j.id===jA.id);
        if(!jB) return jA;
        return {...jA, x:lerp(jA.x,jB.x,t), y:lerp(jA.y,jB.y,t)};
    });
    fB.jugs.forEach(jB=>{ if(!fA.jugs.find(j=>j.id===jB.id)) jugs.push(jB); });
    let balon=null;
    if(fA.balon&&fB.balon) balon={x:lerp(fA.balon.x,fB.balon.x,t),y:lerp(fA.balon.y,fB.balon.y,t)};
    else balon=t<0.5?fA.balon:fB.balon;
    return {jugs,trazos:fB.trazos,balon};
}

function playAnim(){
    if(frames.length<2)return;
    animOn=true;
    document.getElementById('btn-play').innerText='Stop';
    const spd=parseInt(document.getElementById('spd').value)||1000;

    if(!interpMode){
        // Salto directo de fotograma en fotograma, sin transición.
        animIdx=0; fi=0; renderFBar();
        animTimer=setInterval(()=>{
            fi=animIdx; renderFBar(); render();
            animIdx++;
            if(animIdx>=frames.length){ stopAnim(); }
        },spd);
        return;
    }

    // Modo "Suave": interpola jugadores y balón entre cada par de
    // fotogramas consecutivos para que se vea el movimiento.
    animIdx=1; fi=0; renderFBar();
    let segStart=performance.now();
    function step(now){
        if(!animOn) return;
        const t=Math.min(1,(now-segStart)/spd);
        render(frameInterpolado(frames[animIdx-1],frames[animIdx],t));
        if(t>=1){
            animIdx++;
            if(animIdx>=frames.length){ stopAnim(); return; }
            fi=animIdx-1; renderFBar();
            segStart=now;
        }
        animRAF=requestAnimationFrame(step);
    }
    animRAF=requestAnimationFrame(step);
}

function stopAnim(){
    clearInterval(animTimer); animTimer=null;
    if(animRAF) cancelAnimationFrame(animRAF); animRAF=null;
    animOn=false;
    document.getElementById('btn-play').innerText='Play';
    render();
}

function addFrame(){
    const prev=cf();
    const nf=mkFrame();
    nf.jugs=prev.jugs.map(j=>({...j}));
    nf.balon=prev.balon?{...prev.balon}:null;
    frames.push(nf); fi=frames.length-1;
    renderFBar(); actualizarLista(); render();
}

function irAFrame(i){
    fi=i; renderFBar(); actualizarLista(); render();
}

function renderFBar(){
    const cont=document.getElementById('fcont');cont.innerHTML='';
    frames.forEach((f,i)=>{
        const wrap=document.createElement('div');
        wrap.className='fthumb'+(i===fi?' on':'');
        wrap.onclick=()=>irAFrame(i);
        const num=document.createElement('div');num.className='fnum';num.innerText=i+1;
        wrap.appendChild(num);cont.appendChild(wrap);
    });
}

function setTool(t){
    tool=t;
    document.querySelectorAll('.toolbar .tb').forEach(b=>b.classList.remove('on'));
    document.getElementById('t-'+t)?.classList.add('on');
}

function setColor(c,el){
    color=c;
    document.querySelectorAll('.clr').forEach(d=>d.classList.remove('on'));
    el.classList.add('on');
}

function setForm(f){
    formActual=f;
    const pos=(vertical?FORMS_V:FORMS)[f]; const fr=cf();
    fr.jugs.forEach((j,i)=>{if(pos[i]){j.x=pos[i][0];j.y=pos[i][1];}});
    render();
}

function borrarTrazos(){cf().trazos=[];render();}
function borrarTodo(){cf().jugs=[];cf().trazos=[];cf().balon=null;selJug=null;actualizarLista();render();}

function poblarLista(){
    const list=document.getElementById('jlist');list.innerHTML='';
    JUGS.forEach(j=>{
        const item=document.createElement('div');item.className='ji';item.id='ji-'+j.id;
        item.innerHTML=`<img class="jfoto" src="${j.f}"><div class="ji-overlay"><div class="jnombre">${j.n}</div></div>`;
        item.onclick=()=>agregarJug(j.id);
        list.appendChild(item);
    });
}

function actualizarLista(){
    const enc=cf().jugs.map(j=>j.id);
    JUGS.forEach(j=>{
        const el=document.getElementById('ji-'+j.id);
        if(el)el.classList.toggle('enc',enc.includes(j.id));
    });
}

function agregarJug(id){
    const fr=cf(); if(fr.jugs.find(j=>j.id===id))return;
    const pos=(vertical?FORMS_V:FORMS)[formActual]; const i=fr.jugs.length;
    const p=pos[i]||[0.5,0.5];
    const j=JUGS.find(x=>x.id===id);
    fr.jugs.push({id,n:j.n,d:j.d,f:j.f,x:p[0],y:p[1]});
    actualizarLista(); render();
}

function getPos(e){
    const r=canvas.getBoundingClientRect();
    const c=e.touches?e.touches[0]:e;
    return{x:(c.clientX-r.left)/viewW,y:(c.clientY-r.top)/viewH};
}

function hitJug(pos){
    const fr=cf(); const W=viewW, H=viewH;
    for(let i=fr.jugs.length-1;i>=0;i--){
        const j=fr.jugs[i];
        const rw=Math.min(W,H)*0.185, rh=rw*1.4;
        if(Math.abs(j.x*W - pos.x*W) < rw/2 && Math.abs(j.y*H - pos.y*H) < rh/2) return i;
    }
    return -1;
}

canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();onUp(e);},{passive:false});

function onDown(e){
    if(animOn)return;
    const pos=getPos(e); const fr=cf();
    if(tool==='bal'){fr.balon={x:pos.x,y:pos.y};dragBal=true;render();return;}
    if(tool==='riv'){
        const n=fr.jugs.filter(j=>j.rival).length+1;
        fr.jugs.push({id:'riv'+(rivalSeq++), n:'R'+n, rival:true, x:pos.x, y:pos.y});
        selJug=fr.jugs.length-1;
        setTool('sel');
        render();
        return;
    }
    if(tool==='sel'){
        const hi=hitJug(pos);
        if(hi>=0){dragJug=hi;selJug=hi;render();return;}
        selJug=null;render();return;
    }
    drawing=true;drawStart={...pos};drawCur={...pos};
}

function onMove(e){
    if(animOn)return;
    const pos=getPos(e); const fr=cf();
    if(dragJug!==null){
        fr.jugs[dragJug].x=Math.max(0.02,Math.min(0.98,pos.x));
        fr.jugs[dragJug].y=Math.max(0.02,Math.min(0.98,pos.y));
        render();return;
    }
    if(dragBal&&fr.balon){
        fr.balon.x=pos.x; fr.balon.y=pos.y; render();return;
    }
    if(drawing){ drawCur={...pos}; render(); }
}

function onUp(){
    if(drawing&&drawStart&&drawCur){
        const t=buildTrazo(drawStart,drawCur);
        if(t){cf().trazos.push(t);}
    }
    dragJug=null; dragBal=false; drawing=false; render();
}

function buildTrazo(s,c){
    if(tool==='arr'||tool==='lin') return{tipo:tool,x1:s.x,y1:s.y,x2:c.x,y2:c.y,color};
    if(tool==='cir') return{tipo:'cir',cx:(s.x+c.x)/2,cy:(s.y+c.y)/2,rx:Math.abs(c.x-s.x)/2,ry:Math.abs(c.y-s.y)/2,color};
    if(tool==='zon') return{tipo:'zon',x1:s.x,y1:s.y,x2:c.x,y2:c.y,color};
    return null;
}

function abrirDL(){document.getElementById('mdl-dl').classList.add('on');}
function cerrarDL(){document.getElementById('mdl-dl').classList.remove('on');}
function dlFrame(){
    const a=document.createElement('a');a.download='pizarra.png';
    a.href=canvas.toDataURL();a.click();cerrarDL();
}
function dlTodos(){
    frames.forEach((f,i)=>{
        render(f);
        const a=document.createElement('a');
        a.download=`pizarra-${i+1}.png`;
        a.href=canvas.toDataURL();
        a.click();
    });
    render();
    cerrarDL();
}

poblarLista();
initFrames();
resize();

// El canvas dibuja el texto con la tipografía Squada One; si aún no ha
// terminado de cargar en el momento del primer render(), el navegador
// la sustituye en silencio por una genérica y no vuelve a intentarlo
// solo. Forzamos un repintado en cuanto la fuente esté lista.
if(document.fonts&&document.fonts.ready){
    document.fonts.ready.then(()=>render());
}
</script>
